<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | حسابداری هوشمند ساحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">

  <div class="auth-panel">
    <a href="index.html" class="auth-brand">
      <svg width="30" height="30" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#0B3D42"/>
        <path d="M4 24C8 20 12 20 16 24C20 28 24 28 28 24C32 20 36 20 36 20" stroke="#8FE3D3" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <path d="M4 29C8 25 12 25 16 29C20 33 24 33 28 29C32 25 36 25 36 25" stroke="#2FB8A6" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </svg>
      <span>حسابداری هوشمند ساحل</span>
    </a>

    <div class="auth-card">
      <h1>ورود به حساب کاربری</h1>
      <p class="sub">برای مدیریت پروژه‌ها و شیت‌های خود وارد شوید.</p>

      <form id="loginForm">
        <div class="field">
          <input type="email" id="loginEmail" placeholder="ایمیل خود را وارد کنید" required>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 6.5L12 13L21 6.5M4 5H20C20.5523 5 21 5.44772 21 6V18C21 18.5523 20.5523 19 20 19H4C3.44772 19 3 18.5523 3 18V6C3 5.44772 3.44772 5 4 5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <div class="field">
          <input type="password" id="loginPassword" placeholder="رمز عبور خود را وارد کنید" required>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
        </div>

        <div id="loginError" style="display:none; background:rgba(228,120,91,0.12); color:#C0472B; border-radius:10px; padding:11px 14px; font-size:13.5px; margin-bottom:16px;"></div>

        <div class="auth-row">
          <label class="auth-check"><input type="checkbox"> مرا به‌خاطر بسپار</label>
          <a href="#">رمز عبور را فراموش کرده‌اید؟</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">ورود</button>
      </form>

      <p class="auth-foot">حساب کاربری ندارید؟ <a href="#">ثبت‌نام کنید</a></p>
    </div>
  </div>

  <div class="auth-art" aria-hidden="true">
    <svg viewBox="0 0 900 1200" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <circle cx="700" cy="150" r="70" fill="#FCEFC7" opacity="0.9"/>
      <circle cx="700" cy="150" r="70" fill="#FCEFC7" opacity="0.5">
        <animate attributeName="r" values="70;78;70" dur="6s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 480C120 420 200 420 280 470C370 525 430 470 520 430C610 390 700 420 780 470C830 500 900 480 900 480V1200H0V480Z" fill="#0E4A52" opacity="0.55"/>
      <path d="M0 600C110 560 220 640 340 600C450 565 520 630 620 610C720 590 800 630 900 600V1200H0V600Z" fill="#0B3D42" opacity="0.75"/>
      <g opacity="0.9">
        <path d="M90 760C90 760 60 690 90 640C100 660 100 690 100 690C100 690 120 650 150 645C135 675 120 705 120 705" stroke="#0B3D42" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M90 760C90 760 130 700 90 650C90 675 85 695 85 695C85 695 65 660 35 660C55 685 75 715 75 715" stroke="#0B3D42" stroke-width="7" stroke-linecap="round" fill="none"/>
        <rect x="85" y="755" width="10" height="90" rx="4" fill="#0B3D42"/>
      </g>
      <g opacity="0.85">
        <path d="M810 820C810 820 780 750 810 700C820 720 820 750 820 750C820 750 840 710 870 705C855 735 840 765 840 765" stroke="#0E4A52" stroke-width="6" stroke-linecap="round" fill="none"/>
        <rect x="806" y="815" width="9" height="80" rx="4" fill="#0E4A52"/>
      </g>
      <path d="M0 900C100 860 200 940 320 900C440 860 520 930 640 905C760 880 840 920 900 900V1200H0V900Z" fill="#1B6B76"/>
      <path d="M0 980C120 950 240 1010 360 985C480 960 560 1010 680 990C780 975 840 1000 900 985V1200H0V980Z" fill="#E9DCBD"/>
    </svg>
    <div class="auth-art-label">
      <b>مدیریت پروژه‌ها و اطلاعات مالی، در یک نگاه</b>
      <span>داشبورد یکپارچه ساحل برای رصد پروژه‌ها، شیت‌ها و تیم شما</span>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/main.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
