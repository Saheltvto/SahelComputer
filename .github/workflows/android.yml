name: Build Android APK (استودیو ساحل)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Copy website files into the app
        run: |
          A=android/app/src/main/assets
          rm -rf "$A"
          mkdir -p "$A"
          cp login.html dashboard.html manifest.json "$A"/
          cp -r css js assets "$A"/

      - name: Use private signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SAHEL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SAHEL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SAHEL_KEYSTORE_PASSWORD=${{ secrets.SAHEL_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SAHEL_KEY_ALIAS=${{ secrets.SAHEL_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SAHEL_KEY_PASSWORD=${{ secrets.SAHEL_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/SahelStudio.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SahelStudio-apk
          path: out/SahelStudio.apk

      - name: Publish APK as a Release (stable download link)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: android-latest
          name: استودیو ساحل — آخرین نسخه
          body: "آخرین نسخهٔ APK برنامهٔ استودیو ساحل. فایل SahelStudio.apk را دانلود و نصب کنید."
          files: out/SahelStudio.apk
          make_latest: true
