<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارتابل | حسابداری هوشمند ساحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  /* --- استایل‌های اضافه برای نمای تمام‌صفحه کارتابل، منوی کاربر و صندوق فایل --- */
  html, body { height: 100%; }
  .app-shell { display: block; }
  .main-col { display: flex; flex-direction: column; height: 100vh; }
  .page { flex: 1; padding: 0 !important; min-height: 0; }

  .topbar-user { position: relative; cursor: pointer; }
  .user-dropdown {
    position: absolute;
    top: calc(100% + 10px);
    inset-inline-start: 0;
    background: #fff;
    border: 1px solid var(--line, #E4ECEC);
    border-radius: 12px;
    box-shadow: var(--shadow, 0 8px 24px rgba(0,0,0,0.10));
    min-width: 150px;
    padding: 6px;
    z-index: 60;
    display: none;
  }
  .user-dropdown-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    color: #C0472B;
    text-decoration: none;
    font-weight: 600;
    font-size: 13.5px;
  }
  .user-dropdown-logout:hover { background: rgba(192,71,43,0.08); }

  #workspaceTabs {
    display: none;
    gap: 8px;
    flex-wrap: wrap;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid var(--line, #E4ECEC);
  }
  #workspaceFrame { display: none; width: 100%; flex: 1; border: none; background: #fff; }
  #workspaceEmpty {
    display: none;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #7F9A9C;
    padding: 40px;
  }
  #workspaceView { display: flex; flex-direction: column; height: 100%; }

  /* --- صندوق ارسال/دریافت فایل --- */
  .topbar-icon { position: relative; }
  .file-panel {
    position: absolute;
    top: calc(100% + 12px);
    inset-inline-end: 0;
    width: 320px;
    max-height: 420px;
    background: #fff;
    border: 1px solid var(--line, #E4ECEC);
    border-radius: 14px;
    box-shadow: var(--shadow, 0 10px 28px rgba(0,0,0,0.12));
    z-index: 60;
    display: none;
    flex-direction: column;
    text-align: right;
    cursor: default;
  }
  .file-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line, #E4ECEC);
    font-size: 13.5px;
  }
  .file-panel-head b { font-weight: 700; color: var(--deep, #0B3D42); }
  #fileSendForm {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line, #E4ECEC);
    background: #FAFCFC;
  }
  #fileSendForm select, #fileSendForm input[type="file"] {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line, #E4ECEC);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.8px;
    background: #fff;
  }
  #fileSendStatus { font-size: 12px; min-height: 16px; }
  #fileList { overflow-y: auto; flex: 1; }
  .file-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line, #F1F5F5);
    text-decoration: none;
    color: inherit;
  }
  .file-item:hover { background: #FAFCFC; }
  .file-item.unread { background: rgba(47,184,166,0.06); }
  .file-item b { font-size: 13px; }
  .file-item span { font-size: 11.5px; color: #7F9A9C; }
  .file-empty { padding: 24px 14px; text-align: center; color: #7F9A9C; font-size: 13px; }
</style>
</head>
<body>

<div class="app-shell">

  <div class="main-col">
    <div class="topbar">

      <div class="topbar-user" id="topbarUser">
        <div class="avatar" id="topbarAvatar">–</div>
        <div class="who">
          <b id="topbarName">در حال بارگذاری...</b>
          <span id="topbarRole">—</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="#7F9A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <div class="user-dropdown" id="userDropdown">
          <a href="login.html" class="user-dropdown-logout" id="logoutBtn">
            خروج
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </a>
        </div>
      </div>

      <span class="topbar-icon" title="ارسال و دریافت فایل" id="fileTransferBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 9C6 5.7 8.7 3 12 3C15.3 3 18 5.7 18 9C18 14 20 15 20 16H4C4 15 6 14 6 9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19C10 20.1 10.9 21 12 21C13.1 21 14 20.1 14 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="badge" id="fileBadge" style="display:none;">0</span>

        <div class="file-panel" id="filePanel">
          <div class="file-panel-head">
            <b>ارسال و دریافت فایل</b>
            <button type="button" id="newFileBtn" class="btn btn-ghost" style="padding:5px 12px; font-size:12.5px;">+ ارسال فایل</button>
          </div>

          <div id="fileSendForm">
            <select id="fileRecipient"></select>
            <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.png,.jpg,.jpeg">
            <button type="button" id="fileSendBtn" class="btn btn-primary" style="padding:7px; font-size:12.8px;">ارسال</button>
            <span id="fileSendStatus"></span>
          </div>

          <div id="fileList">
            <div class="file-empty">در حال بارگذاری...</div>
          </div>
        </div>
      </span>

      <a href="index.html" style="margin-inline-start:auto; display:flex; align-items:center; gap:8px; font-weight:800; color:var(--deep);">
        <svg width="26" height="26" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="#0B3D42"/><path d="M4 24C8 20 12 20 16 24C20 28 24 28 28 24C32 20 36 20 36 20" stroke="#8FE3D3" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
        <span style="display:none;" class="brand-full">حسابداری هوشمند ساحل</span>
      </a>
    </div>

    <div class="page">
      <div id="workspaceView">
        <div id="workspaceTabs"></div>
        <div id="workspaceEmpty">
          لینک کارتابل برای این کاربر تنظیم نشده — با مدیر سیستم تماس بگیرید.
        </div>
        <iframe id="workspaceFrame"></iframe>
      </div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/dashboard.js" defer></script>
</body>
</html>
