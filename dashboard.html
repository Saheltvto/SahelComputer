<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارتابل | حسابداری هوشمند ساحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  /* --- استایل‌های اضافه برای نمای تمام‌صفحه کارتابل، منوی کاربر و صندوق فایل --- */
  html, body { height: 100%; }
  .app-shell { display: block; }
  .main-col { display: flex; flex-direction: column; height: 100vh; }
  .page { flex: 1; padding: 0 !important; min-height: 0; }

  .topbar-user { position: relative; cursor: pointer; }

  /* هر دو پنل با position:fixed رندر می‌شن و مختصاتشون با جاوااسکریپت
     بر اساس محل دکمه محاسبه می‌شه، تا هیچ ancestor ای (با overflow:hidden
     یا ارتفاع ثابت) نصفشون رو نبره. */
  .user-dropdown, .file-panel {
    position: fixed;
    background: #fff;
    border: 1px solid #E9F1F1;
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(11,61,66,0.14), 0 2px 8px rgba(11,61,66,0.06);
    z-index: 500;
    display: none;
    animation: panelPop .16s ease;
  }
  @keyframes panelPop {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .user-dropdown {
    min-width: 160px;
    padding: 8px;
  }
  .user-dropdown-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px;
    border-radius: 10px;
    color: #C0472B;
    text-decoration: none;
    font-weight: 600;
    font-size: 13.5px;
    transition: background .15s ease;
  }
  .user-dropdown-logout:hover { background: rgba(192,71,43,0.09); }

  #workspaceTabs {
    display: none;
    gap: 8px;
    flex-wrap: wrap;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid var(--line, #E4ECEC);
  }
  #workspaceFrame { display: none; width: 100%; flex: 1; border: none; background: #fff; }
  #workspaceEmpty {
    display: none;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #7F9A9C;
    padding: 40px;
  }
  #workspaceView { display: flex; flex-direction: column; height: 100%; }

  /* --- صندوق ارسال/دریافت فایل --- */
  .topbar-icon { position: relative; cursor: pointer; }
  .file-panel {
    width: 336px;
    max-height: 460px;
    flex-direction: column;
    text-align: right;
    cursor: default;
    overflow: hidden;
  }
  .file-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(135deg, #0B3D42, #14555C);
  }
  .file-panel-head b { font-weight: 700; color: #fff; font-size: 14px; }
  .file-panel-head .btn-add {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    color: #0B3D42;
    background: #8FE3D3;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: filter .15s ease, transform .15s ease;
  }
  .file-panel-head .btn-add:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .file-panel-head .btn-add.is-open { background: rgba(255,255,255,0.18); color: #fff; }

  #fileSendForm {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #EDF3F3;
    background: #F6FAFA;
  }
  .field-label { font-size: 11.5px; color: #7F9A9C; font-weight: 600; margin-bottom: 2px; }
  #fileSendForm select {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1.5px solid #E0EAEA;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="%237F9A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat left 10px center;
    background-size: 16px;
    color: #0B3D42;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  #fileSendForm select:focus { outline: none; border-color: #2FB8A6; }

  .file-upload {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed #C9DEDE;
    border-radius: 10px;
    background: #fff;
    color: #7F9A9C;
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .file-upload:hover { border-color: #2FB8A6; color: #2FB8A6; background: rgba(47,184,166,0.04); }
  .file-upload svg { flex-shrink: 0; }
  .file-upload.has-file { border-style: solid; border-color: #2FB8A6; color: #0B3D42; background: rgba(47,184,166,0.06); }
  #fileInputLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #fileSendBtn {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #2FB8A6, #1B6B76);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: filter .15s ease, transform .15s ease, opacity .15s ease;
  }
  #fileSendBtn:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
  #fileSendBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #fileSendStatus { font-size: 12px; min-height: 16px; text-align: center; font-weight: 600; }

  #fileList { overflow-y: auto; flex: 1; max-height: 300px; }
  #fileList::-webkit-scrollbar { width: 6px; }
  #fileList::-webkit-scrollbar-thumb { background: #DCE9E9; border-radius: 6px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    border-bottom: 1px solid #F1F5F5;
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: background .15s ease;
  }
  .file-item:hover { background: #F6FAFA; }
  .file-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EAF6F4;
    color: #2FB8A6;
  }
  .file-item-body { flex: 1; min-width: 0; }
  .file-item-body b {
    display: block;
    font-size: 13px;
    color: #0B3D42;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item-body span { font-size: 11.5px; color: #7F9A9C; }
  .file-item.unread .file-item-body b { font-weight: 800; }
  .unread-dot {
    position: absolute;
    inset-inline-start: 14px;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2FB8A6;
  }
  .file-empty { padding: 30px 16px; text-align: center; color: #7F9A9C; font-size: 13px; }
</style>
</head>
<body>

<div class="app-shell">

  <div class="main-col">
    <div class="topbar">

      <div class="topbar-user" id="topbarUser">
        <div class="avatar" id="topbarAvatar">–</div>
        <div class="who">
          <b id="topbarName">در حال بارگذاری...</b>
          <span id="topbarRole">—</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="#7F9A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <span class="topbar-icon" title="ارسال و دریافت فایل" id="fileTransferBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 9C6 5.7 8.7 3 12 3C15.3 3 18 5.7 18 9C18 14 20 15 20 16H4C4 15 6 14 6 9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19C10 20.1 10.9 21 12 21C13.1 21 14 20.1 14 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="badge" id="fileBadge" style="display:none;">0</span>
      </span>

      <a href="index.html" style="margin-inline-start:auto; display:flex; align-items:center; gap:8px; font-weight:800; color:var(--deep);">
        <svg width="26" height="26" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="#0B3D42"/><path d="M4 24C8 20 12 20 16 24C20 28 24 28 28 24C32 20 36 20 36 20" stroke="#8FE3D3" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
        <span style="display:none;" class="brand-full">حسابداری هوشمند ساحل</span>
      </a>
    </div>

    <div class="page">
      <div id="workspaceView">
        <div id="workspaceTabs"></div>
        <div id="workspaceEmpty">
          لینک کارتابل برای این کاربر تنظیم نشده — با مدیر سیستم تماس بگیرید.
        </div>
        <iframe id="workspaceFrame"></iframe>
      </div>
    </div>
  </div>

  <!-- پنل‌های کشویی: بیرون از هر ancestor محدودکننده، position:fixed و مختصاتشون با JS تنظیم می‌شه -->
  <div class="user-dropdown" id="userDropdown">
    <a href="login.html" class="user-dropdown-logout" id="logoutBtn">
      خروج
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
  </div>

  <div class="file-panel" id="filePanel">
    <div class="file-panel-head">
      <b>ارسال و دریافت فایل</b>
      <button type="button" id="newFileBtn" class="btn-add">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        ارسال فایل
      </button>
    </div>

    <div id="fileSendForm">
      <div>
        <div class="field-label">گیرنده</div>
        <select id="fileRecipient">
          <option value="">در حال بارگذاری کاربران...</option>
        </select>
      </div>
      <div>
        <div class="field-label">فایل</div>
        <label class="file-upload" for="fileInput" id="fileUploadLabel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="fileInputLabel">انتخاب فایل (PDF، اکسل یا عکس)</span>
        </label>
        <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.png,.jpg,.jpeg" style="display:none;">
      </div>
      <button type="button" id="fileSendBtn">ارسال فایل</button>
      <span id="fileSendStatus"></span>
    </div>

    <div id="fileList">
      <div class="file-empty">در حال بارگذاری...</div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/dashboard.js" defer></script>
</body>
</html>
