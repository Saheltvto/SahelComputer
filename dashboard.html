<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارتابل | حسابداری هوشمند ساحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ==================== استایل‌های پایه ==================== */
  :root {
    --deep: #0B3D42;
    --teal: #14555C;
    --accent: #2FB8A6;
    --accent-light: #8FE3D3;
    --bg-light: #F6FAFA;
    --bg-accent: #EAF6F4;
    --border: #E0EAEA;
    --border-light: #E9F1F1;
    --text: #0B3D42;
    --text-muted: #7F9A9C;
    --danger: #C0472B;
    --gold: #B8860B;
    --shadow-sm: 0 2px 10px rgba(11,61,66,0.08);
    --shadow-md: 0 4px 20px rgba(11,61,66,0.12);
    --shadow-lg: 0 16px 40px rgba(11,61,66,0.14);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 25px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html, body { 
    height: 100%; 
    margin: 0;
    font-family: 'Vazirmatn', sans-serif;
  }
  
  .app-shell { display: block; }
  .main-col { display: flex; flex-direction: column; height: 100vh; }
  .page { flex: 1; padding: 0 !important; min-height: 0; }

  /* ==================== نوار بالایی ==================== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-user { 
    position: relative; 
    cursor: pointer; 
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 12px;
    transition: var(--transition);
  }
  
  .topbar-user:hover {
    background: rgba(47,184,166,0.08);
  }
  
  .topbar-user .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--deep), var(--teal));
    color: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    border: 2px solid transparent;
    transition: var(--transition);
  }
  
  .topbar-user:hover .avatar {
    border-color: var(--accent);
    transform: scale(1.05);
    box-shadow: 0 0 0 4px rgba(47,184,166,0.15);
  }
  
  .topbar-user .who {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  
  .topbar-user .who b {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  
  .topbar-user .who span {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.3;
  }

  /* ==================== آیکون‌های نوار ==================== */
  .topbar-icon { 
    position: relative; 
    cursor: pointer; 
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    color: var(--deep);
    transition: var(--transition);
  }
  
  .topbar-icon svg {
    width: 22px;
    height: 22px;
  }
  
  .topbar-icon:hover {
    background: rgba(47,184,166,0.1);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.2);
  }
  
  .topbar-icon:active {
    transform: translateY(0);
  }
  
  .badge {
    position: absolute;
    top: 2px;
    left: 2px;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
    animation: badgePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes badgePop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  /* ==================== نوار اطلاعات زنده ==================== */
  .topbar-info {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-inline-end: auto;
    padding: 6px 16px;
    background: linear-gradient(135deg, rgba(246,250,250,0.95), rgba(234,246,244,0.95));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(224,234,234,0.7);
    border-radius: var(--radius-lg);
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow-x: auto;
    max-width: 46vw;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  
  .topbar-info::-webkit-scrollbar { display: none; }

  .ti-item { 
    display: flex; 
    align-items: center; 
    gap: 5px; 
    font-weight: 600; 
    flex-shrink: 0;
    padding: 5px 10px;
    border-radius: 14px;
    transition: var(--transition);
    cursor: default;
    position: relative;
    animation: fadeInUp 0.5s ease;
    animation-fill-mode: both;
  }
  
  .ti-item:nth-child(1) { animation-delay: 0.05s; }
  .ti-item:nth-child(3) { animation-delay: 0.15s; }
  .ti-item:nth-child(5) { animation-delay: 0.25s; }
  .ti-item:nth-child(7) { animation-delay: 0.35s; }
  .ti-item:nth-child(9) { animation-delay: 0.45s; }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .ti-item:hover {
    background: rgba(47,184,166,0.12);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.15);
  }
  
  .ti-item::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,184,166,0.4); }
    70% { box-shadow: 0 0 0 5px rgba(47,184,166,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,184,166,0); }
  }
  
  .ti-sep { 
    width: 1px; 
    height: 18px; 
    background: linear-gradient(to bottom, transparent, #DCE9E9, transparent);
    flex-shrink: 0; 
  }
  
  .rate-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    transition: color 0.2s ease;
  }
  
  .ti-item:hover .rate-label { color: var(--text); }
  
  .rate-value {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.5px;
    transition: var(--transition);
  }
  
  .ti-item:hover .rate-value { transform: scale(1.05); }
  
  .date-value { font-size: 12px; font-weight: 700; }
  
  .weather-temp { font-size: 13px; font-weight: 800; color: var(--teal); }
  .weather-desc { font-size: 11px; font-weight: 600; color: var(--teal); }
  .weather-city {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    background: rgba(47,184,166,0.15);
    padding: 2px 7px;
    border-radius: 8px;
    transition: var(--transition);
  }
  
  .ti-item:hover .weather-city {
    background: rgba(47,184,166,0.25);
    color: var(--text);
  }
  
  #tiDate { color: var(--text); font-weight: 700; }
  #tiWeather { color: var(--teal); }
  #tiUsd .rate-value { color: #0B8F7A; }
  #tiAed .rate-value { color: #A03A22; }
  #tiCoin .rate-value { color: #9A7209; }
  
  #tiUsd:hover .rate-value,
  #tiCoin:hover .rate-value {
    animation: glow 1.5s ease-in-out;
  }
  
  @keyframes glow {
    0% { text-shadow: 0 0 0 rgba(47,184,166,0); }
    50% { text-shadow: 0 0 8px rgba(47,184,166,0.4); }
    100% { text-shadow: 0 0 0 rgba(47,184,166,0); }
  }

  /* ==================== گوشه برند ==================== */
  .topbar-brand-zone { display: flex; align-items: center; gap: 12px; }
  
  .brand-link { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    font-weight: 800; 
    color: var(--deep); 
    text-decoration: none;
    transition: var(--transition);
  }
  
  .brand-link:hover { transform: scale(1.05); }
  
  .topbar-social { display: flex; align-items: center; gap: 6px; }
  
  .topbar-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-light);
    color: var(--deep);
    transition: var(--transition);
  }
  
  .topbar-social a:hover { 
    background: var(--accent); 
    color: #fff; 
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.3);
  }
  
  .topbar-social a svg { width: 15px; height: 15px; }
  
  .topbar-support-phone { 
    width: auto !important; 
    border-radius: 20px !important; 
    padding: 0 14px !important; 
    gap: 6px; 
    font-size: 12.5px; 
    font-weight: 700; 
    background: linear-gradient(135deg, var(--accent), var(--teal)) !important;
    color: #fff !important;
  }
  
  .topbar-support-phone:hover {
    background: linear-gradient(135deg, #3CC9B7, #1B6B76) !important;
  }
  
  .topbar-support-phone span { white-space: nowrap; }

  /* ==================== پنل‌های کشویی ==================== */
  .user-dropdown, .file-panel, .members-panel, .chat-panel {
    position: fixed;
    background: #fff;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg), 0 2px 8px rgba(11,61,66,0.06);
    z-index: 500;
    display: none;
    animation: panelPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes panelPop {
    from { opacity: 0; transform: translateY(-15px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .user-dropdown {
    min-width: 160px;
    padding: 8px;
  }
  
  .user-dropdown-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    color: var(--danger);
    text-decoration: none;
    font-weight: 600;
    font-size: 13.5px;
    transition: background 0.15s ease;
  }
  
  .user-dropdown-logout:hover { background: rgba(192,71,43,0.09); }

  /* ==================== ورک‌اسپیس ==================== */
  #workspaceFrame { display: none; width: 100%; flex: 1; border: none; background: #fff; }
  
  #workspaceEmpty {
    display: none;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
    font-size: 15px;
  }
  
  #workspaceView { display: flex; flex-direction: column; height: 100%; }

  /* ==================== صندوق فایل ==================== */
  .file-panel {
    width: 350px;
    max-height: 480px;
    flex-direction: column;
    text-align: right;
    cursor: default;
    overflow: hidden;
  }
  
  .file-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--deep), var(--teal));
  }
  
  .file-panel-head b { font-weight: 700; color: #fff; font-size: 14px; }
  
  .file-panel-head .btn-add {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--deep);
    background: var(--accent-light);
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .file-panel-head .btn-add:hover { 
    filter: brightness(1.06); 
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(143,227,211,0.4);
  }
  
  .file-panel-head .btn-add.is-open { background: rgba(255,255,255,0.18); color: #fff; }

  #fileSendForm {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #EDF3F3;
    background: var(--bg-light);
  }
  
  .field-label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
  
  #fileSendForm select {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="%237F9A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat left 10px center;
    background-size: 16px;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  
  #fileSendForm select:focus { outline: none; border-color: var(--accent); }

  .file-upload {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed #C9DEDE;
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--text-muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .file-upload:hover { 
    border-color: var(--accent); 
    color: var(--accent); 
    background: rgba(47,184,166,0.04); 
  }
  
  .file-upload svg { flex-shrink: 0; }
  
  .file-upload.has-file { 
    border-style: solid; 
    border-color: var(--accent); 
    color: var(--text); 
    background: rgba(47,184,166,0.06); 
  }
  
  #fileInputLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #fileChipsList { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  
  .file-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12.3px;
    color: var(--text);
  }
  
  .file-chip-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip-size { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
  
  .file-chip-remove {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(192,71,43,0.1);
    color: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .file-chip-remove:hover { background: var(--danger); color: #fff; }

  #fileSendBtn {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
  }
  
  #fileSendBtn:hover:not(:disabled) { 
    filter: brightness(1.05); 
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.3);
  }
  
  #fileSendBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #fileSendStatus { font-size: 12px; min-height: 16px; text-align: center; font-weight: 600; }

  #fileList { overflow-y: auto; flex: 1; max-height: 320px; }
  #fileList::-webkit-scrollbar { width: 6px; }
  #fileList::-webkit-scrollbar-track { background: transparent; }
  #fileList::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    border-bottom: 1px solid #F1F5F5;
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: var(--transition);
  }
  
  .file-item:hover { background: var(--bg-light); }
  
  .file-item::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 50%;
    left: 50%;
    height: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  
  .file-item:hover::after { right: 0; left: 0; }
  
  .file-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-accent);
    color: var(--accent);
  }
  
  .file-item-body { flex: 1; min-width: 0; }
  
  .file-item-body b {
    display: block;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .file-item-body span { font-size: 11.5px; color: var(--text-muted); }
  .file-item.unread .file-item-body b { font-weight: 800; }
  
  .unread-dot {
    position: absolute;
    inset-inline-start: 14px;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  
  .file-empty { padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ==================== کشوی کارتابل اعضا ==================== */
  .members-panel {
    width: 280px;
    max-height: 420px;
    flex-direction: column;
    overflow: hidden;
    text-align: right;
    cursor: default;
  }
  
  .members-panel-head {
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--deep), var(--teal));
  }
  
  .members-panel-head b { color: #fff; font-size: 14px; font-weight: 700; }
  
  #membersList { overflow-y: auto; flex: 1; max-height: 360px; }
  #membersList::-webkit-scrollbar { width: 6px; }
  #membersList::-webkit-scrollbar-track { background: transparent; }
  #membersList::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }
  
  .member-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid #F1F5F5;
    position: relative;
    transition: var(--transition);
  }
  
  .member-row:hover { background: var(--bg-light); }
  .member-row.active { background: rgba(47,184,166,0.08); }
  
  .member-row::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 50%;
    left: 50%;
    height: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  
  .member-row:hover::after,
  .member-row.active::after { right: 0; left: 0; }
  
  .member-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--deep), var(--teal));
    color: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    flex-shrink: 0;
  }
  
  .member-info { flex: 1; min-width: 0; }
  
  .member-info b {
    display: block;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .member-info span { font-size: 11px; color: var(--text-muted); }
  
  .member-check {
    display: none;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    align-items: center;
    justify-content: center;
  }
  
  .member-row.active .member-check { display: flex; }

  /* ==================== چت‌باکس ==================== */
  .chat-panel {
    width: 360px;
    max-height: 500px;
    flex-direction: column;
    overflow: hidden;
    text-align: right;
    cursor: default;
  }
  
  .chat-panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--deep), var(--teal));
  }
  
  .chat-panel-head b { color: #fff; font-size: 14px; font-weight: 700; }
  
  .chat-back-btn { 
    background: rgba(255,255,255,0.15); 
    border: none; 
    color: #fff; 
    width: 26px; 
    height: 26px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer;
    transition: var(--transition);
  }
  
  .chat-back-btn:hover { background: rgba(255,255,255,0.25); }
  
  #chatContactsView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  
  #chatContactsList { overflow-y: auto; flex: 1; max-height: 420px; }
  #chatContactsList::-webkit-scrollbar { width: 6px; }
  #chatContactsList::-webkit-scrollbar-track { background: transparent; }
  #chatContactsList::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }
  
  .chat-contact-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid #F1F5F5;
    position: relative;
    transition: var(--transition);
  }
  
  .chat-contact-row:hover { background: var(--bg-light); }
  
  .chat-contact-row::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 50%;
    left: 50%;
    height: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  
  .chat-contact-row:hover::after { right: 0; left: 0; }
  
  .chat-contact-row .member-info b { display: flex; align-items: center; gap: 6px; }
  
  .chat-contact-last { 
    font-size: 11.5px; 
    color: var(--text-muted); 
    overflow: hidden; 
    text-overflow: ellipsis; 
    white-space: nowrap; 
    display: block; 
    max-width: 200px; 
  }
  
  .chat-unread-dot { 
    position: absolute; 
    inset-inline-start: 14px; 
    top: 14px; 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  
  #chatMessages { 
    flex: 1; 
    overflow-y: auto; 
    padding: 14px 16px; 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    background: #F9FCFC; 
  }
  
  #chatMessages::-webkit-scrollbar { width: 6px; }
  #chatMessages::-webkit-scrollbar-track { background: transparent; }
  #chatMessages::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }
  
  .chat-bubble { 
    max-width: 78%; 
    padding: 8px 12px; 
    border-radius: 14px; 
    font-size: 13px; 
    line-height: 1.6; 
    word-break: break-word;
    transition: var(--transition);
  }
  
  .chat-bubble:hover { transform: translateY(-1px); }
  .chat-bubble a { color: inherit; text-decoration: underline; }
  
  .chat-bubble-in { 
    align-self: flex-start; 
    background: var(--bg-accent); 
    color: var(--text); 
    border-bottom-left-radius: 4px;
    animation: bubbleIn 0.3s ease;
  }
  
  .chat-bubble-out { 
    align-self: flex-end; 
    background: linear-gradient(135deg, var(--accent), var(--teal)); 
    color: #fff; 
    border-bottom-right-radius: 4px;
    animation: bubbleOut 0.3s ease;
  }
  
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  @keyframes bubbleOut {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  .chat-bubble-out a { color: #fff; }
  .chat-bubble-time { display: block; font-size: 10px; opacity: 0.65; margin-top: 3px; }
  
  .chat-input-row { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    padding: 10px 12px; 
    border-top: 1px solid #EDF3F3; 
    background: #fff; 
  }
  
  .chat-input-row input { 
    flex: 1; 
    border: 1.5px solid var(--border); 
    border-radius: 20px; 
    padding: 9px 14px; 
    font-family: inherit; 
    font-size: 13px; 
    color: var(--text);
    transition: var(--transition);
  }
  
  .chat-input-row input:focus { 
    outline: none; 
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47,184,166,0.1);
  }
  
  .chat-input-row button { 
    flex-shrink: 0; 
    width: 36px; 
    height: 36px; 
    border-radius: 50%; 
    border: none; 
    background: linear-gradient(135deg, var(--accent), var(--teal)); 
    color: #fff; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer;
    transition: var(--transition);
  }
  
  .chat-input-row button:hover { 
    filter: brightness(1.05);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.3);
  }

  /* ==================== ریسپانسیو ==================== */
  @media (max-width: 1100px) { 
    .topbar-support-phone span { display: none; } 
  }
  
  @media (max-width: 900px) { 
    .topbar-info { display: none; } 
  }
  
  @media (max-width: 768px) {
    .topbar {
      padding: 8px 12px;
      gap: 6px;
    }
    
    .topbar-user .who { display: none; }
    
    .topbar-social { display: none; }
    
    .file-panel, .chat-panel {
      width: 95vw;
      max-height: 85vh;
    }
    
    .members-panel {
      width: 85vw;
    }
  }
  
  @media (max-width: 720px) { 
    .topbar-social { display: none; } 
  }
</style>
</head>

        <span class="ti-sep"></span>
        <span class="ti-item" id="tiWeather" title="آب و هوای قشم">—</span>
        <span class="ti-sep"></span>
        <span class="ti-item" id="tiUsd" title="نرخ دلار">—</span>
        <span class="ti-sep"></span>
        <span class="ti-item" id="tiAed" title="نرخ درهم امارات">—</span>
