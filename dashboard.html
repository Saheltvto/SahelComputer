<script>

    try {
      var saved = localStorage.getItem('sahel-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<style>
  /* ====================================================================
     نشان دریایی «ساحل»: پالت، مقیاس تایپوگرافی و توکن‌های یکدست
     ==================================================================== */
  :root {
    /* -- رنگ پایه: سرمه‌ای عمیق دریا تا فیروزه‌ای ساحل -- */
    --ink:        #0A2A2E;
    --teal-900:   #0F3A40;
    --teal-700:   #17565D;
    --accent:     #1FAF9B;
    --accent-2:   #159C8A;
    --accent-soft:#A7E9DC;

    --paper:      #F6FAF9;
    --surface:    #EEF6F4;
    --line:       #DCEAE8;
    --line-soft:  #E9F3F1;
    --text:       #0A2A2E;
    --muted:      #6C8A8C;

    --danger:     #BD4630;
    --gold:       #A8790F;

    /* -- مقیاس گردی: فقط سه سطح، برای انسجام بصری -- */
    --r-sm:  10px;
    --r-md:  16px;
    --r-lg:  22px;
    --r-pill: 999px;

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --fast: 0.18s var(--ease);
    --med:  0.3s var(--ease);

    /* -- سایه: یک خانواده‌ی سایه‌ی یکدست به‌جای چند نسخه‌ی مشابه -- */
    --shadow-1: 0 1px 2px rgba(10,42,46,0.06), 0 4px 14px rgba(10,42,46,0.07);
    --shadow-2: 0 6px 24px rgba(10,42,46,0.12);
    --shadow-3: 0 18px 48px rgba(10,42,46,0.16);

    /* -- شیشه‌ای -- */
    --glass-bg:        rgba(255, 255, 255, 0.66);
    --glass-bg-strong: rgba(255, 255, 255, 0.88);
    --glass-border:    rgba(255, 255, 255, 0.6);
    --bubble-in-bg:    var(--surface);
    --chat-area-bg:    #F8FBFA;
  }

  /* ==================== حالت تاریک ==================== */
  :root[data-theme="dark"] {
    --paper:      #0B2226;
    --surface:    rgba(167, 233, 220, 0.08);
    --line:       rgba(255, 255, 255, 0.10);
    --line-soft:  rgba(255, 255, 255, 0.07);
    --text:       #E8F5F2;
    --muted:      #83A8A9;

    --shadow-1: 0 1px 2px rgba(0,0,0,0.25), 0 4px 16px rgba(0,0,0,0.25);
    --shadow-2: 0 8px 26px rgba(0,0,0,0.35);
    --shadow-3: 0 20px 50px rgba(0,0,0,0.45);

    --glass-bg:        rgba(14, 38, 42, 0.62);
    --glass-bg-strong: rgba(14, 38, 42, 0.9);
    --glass-border:    rgba(255, 255, 255, 0.09);
    --bubble-in-bg:    rgba(255, 255, 255, 0.07);
    --chat-area-bg:    #0B2226;
  }

  :root[data-theme="dark"] .topbar-icon,
  :root[data-theme="dark"] .brand-link { color: var(--text); }

  :root[data-theme="dark"] #workspaceFrame { background: var(--paper); }

  :root[data-theme="dark"] #fileSendForm select,
  :root[data-theme="dark"] .file-chip,
  :root[data-theme="dark"] .chat-input-row,
  :root[data-theme="dark"] .chat-input-row textarea,
  :root[data-theme="dark"] .file-upload {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }
  :root[data-theme="dark"] #fileSendForm { background: rgba(255,255,255,0.03); }

  html { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; font-family: 'Vazirmatn', sans-serif; }

  body {
    background: var(--paper);
    color: var(--text);
    transition: background 0.35s ease, color 0.35s ease;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .app-shell { display: block; }
  .main-col { display: flex; flex-direction: column; height: 100vh; }
  .page { flex: 1; padding: 0 !important; min-height: 0; }

  /* ==================== نوار بالایی ==================== */
  .topbar-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 14px 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-1);
    position: relative;
    transition: box-shadow var(--med), background var(--med);
  }

  .topbar.is-scrolled {
    box-shadow: var(--shadow-2);
    background: var(--glass-bg-strong);
  }

  /* امضای برند: خط ساحلِ ظریف زیر نوار، برگرفته از موج لوگو */
  .topbar-shoreline {
    position: absolute;
    inset-inline: 18px;
    bottom: -7px;
    height: 7px;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.55;
  }
  .topbar-shoreline svg { width: 100%; height: 100%; display: block; }
  .topbar-shoreline path { stroke: var(--accent); }
  :root[data-theme="dark"] .topbar-shoreline { opacity: 0.4; }

  .topbar-user {
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 8px 5px 6px;
    border-radius: var(--r-sm);
    transition: background var(--fast);
  }
  .topbar-user:hover { background: rgba(31,175,155,0.10); }

  .topbar-user .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ink), var(--teal-700));
    color: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13.5px;
    flex-shrink: 0;
  }

  .topbar-user .who { display: flex; flex-direction: column; gap: 1px; }
  .topbar-user .who b { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .topbar-user .who span { font-size: 11px; color: var(--muted); line-height: 1.3; }

  .topbar-user .chev { color: var(--muted); transition: transform var(--fast); flex-shrink: 0; }
  .topbar-user:hover .chev { transform: translateY(1px); }

  /* ==================== آیکون‌های نوار ==================== */
  .topbar-icon {
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    color: var(--teal-900);
    transition: background var(--fast), color var(--fast);
  }
  :root[data-theme="dark"] .topbar-icon { color: var(--accent-soft); }
  .topbar-icon svg { width: 20px; height: 20px; }

  .topbar-icon:hover { background: rgba(31,175,155,0.12); color: var(--accent-2); }
  .topbar-icon:active { transform: scale(0.96); }

  .topbar-icon.is-active {
    background: linear-gradient(135deg, var(--accent), var(--teal-700));
    color: #fff;
  }

  .badge {
    position: absolute;
    top: 1px;
    left: 1px;
    min-width: 17px;
    height: 17px;
    border-radius: 9px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
  }

  /* ==================== نوار اطلاعات زنده ==================== */
  .topbar-info {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-inline-end: auto;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow-x: auto;
    max-width: 46vw;
    scrollbar-width: none;
  }
  .topbar-info::-webkit-scrollbar { display: none; }

  .ti-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    flex-shrink: 0;
    padding: 6px 10px;
    border-radius: 12px;
    cursor: default;
  }
  .ti-item:hover { background: rgba(31,175,155,0.12); }

  .ti-item::before {
    content: '';
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    background-color: currentColor;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-position: center;
    mask-position: center;
    opacity: 0.85;
  }

  }

  .rate-label { font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .rate-value {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.2px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .date-value { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  .weather-temp { font-size: 13px; font-weight: 800; color: var(--accent-2); font-variant-numeric: tabular-nums; }
  .weather-desc { font-size: 11px; font-weight: 600; color: var(--muted); }
  .weather-city {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    background: rgba(31,175,155,0.14);
    padding: 2px 7px;
    border-radius: 8px;
  }

  #tiDate    { color: var(--text); }
  #tiWeather { color: var(--accent-2); }
  #tiUsd, #tiUsd::before   { color: #0B8F7A; }
  #tiAed, #tiAed::before   { color: #B5642C; }
  #tiCoin, #tiCoin::before { color: #9C7A0C; }
  #tiGold, #tiGold::before { color: var(--gold); }

  :root[data-theme="dark"] #tiWeather { color: var(--accent-soft); }
  :root[data-theme="dark"] #tiUsd, :root[data-theme="dark"] #tiUsd::before   { color: #4FE0C4; }
  :root[data-theme="dark"] #tiAed, :root[data-theme="dark"] #tiAed::before   { color: #FF9A7A; }
  :root[data-theme="dark"] #tiCoin, :root[data-theme="dark"] #tiCoin::before { color: #F2C94C; }
  :root[data-theme="dark"] #tiGold, :root[data-theme="dark"] #tiGold::before { color: #F6D776; }

  .ti-sep { width: 1px; height: 18px; background: var(--line); flex-shrink: 0; }

  /* ===== نشانگر وضعیت اتصال اینترنت ===== */
  .conn-status {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: var(--r-pill);
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
  }
  .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .conn-status.is-offline { color: var(--danger); background: rgba(189,70,48,0.1); border-color: rgba(189,70,48,0.25); }
  .conn-status.is-offline .conn-dot { background: var(--danger); }
  @media (max-width: 560px) {
    .conn-status .conn-label { display: none; }
    .conn-status { padding: 7px; }
  }

  /* ==================== گوشه برند ==================== */
  .topbar-brand-zone { display: flex; align-items: center; gap: 10px; }

  .brand-link {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    color: var(--ink);
    text-decoration: none;
  }

  .topbar-social { display: flex; align-items: center; gap: 5px; }

  .topbar-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--teal-900);
    transition: background var(--fast), color var(--fast), transform var(--fast);
  }
  .topbar-social a:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
  .topbar-social a svg { width: 14px; height: 14px; }

  .topbar-support-phone {
    width: auto !important;
    border-radius: var(--r-pill) !important;
    padding: 0 14px !important;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--teal-700)) !important;
    color: #fff !important;
  }
  .topbar-support-phone:hover { filter: brightness(1.06); color: #fff; }
  .topbar-support-phone span { white-space: nowrap; }

  :root[data-theme="dark"] .topbar-social a {
    background: rgba(255,255,255,0.06);
    color: var(--accent-soft);
  }
  :root[data-theme="dark"] .topbar-social a:hover { color: #fff; }

  /* ==================== دکمه تعویض تم ==================== */
  #themeToggleBtn .icon-moon { display: none; }
  :root[data-theme="dark"] #themeToggleBtn .icon-sun { display: none; }
  :root[data-theme="dark"] #themeToggleBtn .icon-moon { display: block; }

  /* ==================== اسکلتون لودینگ (Shimmer) ==================== */
  .skeleton-row { display: flex; align-items: center; gap: 11px; padding: 12px 16px; }

  .skeleton-avatar, .skeleton-line {
    border-radius: 8px;
    background: linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%);
    background-size: 400% 100%;
    animation: skeletonShimmer 1.5s ease infinite;
  }
  .skeleton-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .skeleton-line { height: 10px; }
  .skeleton-line.long { width: 78%; }
  .skeleton-line.mid { width: 55%; }
  .skeleton-line.short { width: 34%; }

  @keyframes skeletonShimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton-avatar, .skeleton-line, .conn-dot { animation: none !important; }
  }

  .topbar-user.is-loading .avatar {
    background: linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%);
    background-size: 400% 100%;
    animation: skeletonShimmer 1.5s ease infinite;
    color: transparent;
  }
  .topbar-user.is-loading #topbarName,
  .topbar-user.is-loading #topbarRole {
    display: inline-block;
    color: transparent;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%);
    background-size: 400% 100%;
    animation: skeletonShimmer 1.5s ease infinite;
  }
  .topbar-user.is-loading #topbarName { width: 78px; height: 12px; }
  .topbar-user.is-loading #topbarRole { width: 48px; height: 9px; margin-top: 2px; }

  /* ==================== پنل‌های کشویی ==================== */
  .user-dropdown, .file-panel, .members-panel, .chat-panel {
    position: fixed;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-3);
    z-index: 500;
    display: none;
    animation: panelPop 0.22s var(--ease);
  }

  @keyframes panelPop {
    from { opacity: 0; transform: translateY(-10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .user-dropdown { min-width: 160px; padding: 8px; }

  .user-dropdown-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px;
    border-radius: var(--r-sm);
    color: var(--danger);
    text-decoration: none;
    font-weight: 600;
    font-size: 13.5px;
    transition: background var(--fast);
  }
  .user-dropdown-logout:hover { background: rgba(189,70,48,0.09); }

  /* ==================== ورک‌اسپیس ==================== */
  #workspaceFrame { display: none; width: 100%; flex: 1; border: none; background: #fff; }

  #workspaceEmpty {
    display: none;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-size: 14.5px;
    gap: 10px;
  }
  #workspaceEmpty svg { color: var(--line); }

  #workspaceView { display: flex; flex-direction: column; height: 100%; }

  /* ==================== پنل‌ها: سرِ مشترک ==================== */
  .file-panel-head, .members-panel-head, .chat-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 18px;
    background: linear-gradient(135deg, var(--ink), var(--teal-700));
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
  .file-panel-head b, .members-panel-head b, .chat-panel-head b {
    font-weight: 700;
    color: #fff;
    font-size: 14px;
  }

  /* ==================== صندوق فایل ==================== */
  .file-panel { width: 350px; max-height: 480px; flex-direction: column; text-align: right; cursor: default; overflow: hidden; }

  .file-panel-head .btn-add {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--accent-soft);
    border: none;
    border-radius: var(--r-pill);
    cursor: pointer;
    transition: filter var(--fast);
  }
  .file-panel-head .btn-add:hover { filter: brightness(1.05); }
  .file-panel-head .btn-add.is-open { background: rgba(255,255,255,0.18); color: #fff; }

  #fileSendForm {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--paper);
  }

  .field-label { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }

  #fileSendForm select {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--r-sm);
    font-family: inherit;
    font-size: 13px;
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="%236C8A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat left 10px center;
    background-size: 16px;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: border-color var(--fast);
  }
  #fileSendForm select:focus { outline: none; border-color: var(--accent); }

  .file-upload {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed var(--line);
    border-radius: var(--r-sm);
    background: #fff;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color var(--fast), color var(--fast), background var(--fast);
  }
  .file-upload:hover { border-color: var(--accent); color: var(--accent-2); background: rgba(31,175,155,0.05); }
  .file-upload svg { flex-shrink: 0; }
  .file-upload.has-file { border-style: solid; border-color: var(--accent); color: var(--text); background: rgba(31,175,155,0.06); }
  #fileInputLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #fileChipsList { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

  .file-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12.3px;
    color: var(--text);
  }
  .file-chip-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip-size { color: var(--muted); font-size: 11px; flex-shrink: 0; }

  .file-chip-remove {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(189,70,48,0.1);
    color: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--fast), color var(--fast);
  }
  .file-chip-remove:hover { background: var(--danger); color: #fff; }

  #fileSendBtn {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--teal-700));
    border: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: filter var(--fast);
  }
  #fileSendBtn:hover:not(:disabled) { filter: brightness(1.05); }
  #fileSendBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #fileSendStatus { font-size: 12px; min-height: 16px; text-align: center; font-weight: 600; }

  #fileList { overflow-y: auto; flex: 1; max-height: 320px; }
  #fileList::-webkit-scrollbar, #membersList::-webkit-scrollbar,
  #chatContactsList::-webkit-scrollbar, #chatMessages::-webkit-scrollbar { width: 5px; }
  #fileList::-webkit-scrollbar-track, #membersList::-webkit-scrollbar-track,
  #chatContactsList::-webkit-scrollbar-track, #chatMessages::-webkit-scrollbar-track { background: transparent; }
  #fileList::-webkit-scrollbar-thumb, #membersList::-webkit-scrollbar-thumb,
  #chatContactsList::-webkit-scrollbar-thumb, #chatMessages::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 6px;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: background var(--fast);
  }
  .file-item:hover { background: var(--paper); }

  .file-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: var(--r-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    color: var(--accent-2);
  }

  .file-item-body { flex: 1; min-width: 0; }
  .file-item-body b { display: block; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item-body span { font-size: 11.5px; color: var(--muted); }
  .file-item.unread .file-item-body b { font-weight: 800; }

  .unread-dot {
    position: absolute;
    inset-inline-start: 14px;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .file-empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ==================== کارتابل اعضا ==================== */
  .members-panel { width: 280px; max-height: 420px; flex-direction: column; overflow: hidden; text-align: right; cursor: default; }

  #membersList { overflow-y: auto; flex: 1; max-height: 360px; }

  .member-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
    transition: background var(--fast);
  }
  .member-row:hover { background: var(--paper); }
  .member-row.active { background: rgba(31,175,155,0.08); }

  .member-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ink), var(--teal-700));
    color: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .member-info { flex: 1; min-width: 0; }
  .member-info b { display: block; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member-info span { font-size: 11px; color: var(--muted); }

  .member-check {
    display: none;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    align-items: center;
    justify-content: center;
  }
  .member-row.active .member-check { display: flex; }

  /* ==================== چت‌باکس ==================== */
  .chat-panel { width: 440px; max-height: 620px; flex-direction: column; overflow: hidden; text-align: right; cursor: default; }

  .chat-back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--fast);
  }
  .chat-back-btn:hover { background: rgba(255,255,255,0.25); }

  #chatContactsView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #chatContactsList { overflow-y: auto; flex: 1; max-height: 540px; }

  .chat-contact-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
    transition: background var(--fast);
  }
  .chat-contact-row:hover { background: var(--paper); }
  .chat-contact-row .member-info b { display: flex; align-items: center; gap: 6px; }

  .chat-contact-last {
    font-size: 11.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    max-width: 260px;
  }

  .chat-unread-dot {
    position: absolute;
    inset-inline-start: 16px;
    top: 15px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  #chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    background: var(--chat-area-bg);
    transition: background 0.35s ease;
  }

  .chat-bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: var(--r-md);
    font-size: 13.5px;
    line-height: 1.7;
    word-break: break-word;
  }
  .chat-bubble a { color: inherit; text-decoration: underline; }

  .chat-bubble-in {
    align-self: flex-start;
    background: var(--bubble-in-bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .chat-bubble-out {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--teal-700));
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-bubble-out a { color: #fff; }
  .chat-bubble-time { display: block; font-size: 10px; opacity: 0.65; margin-top: 3px; }

  .chat-input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--line-soft);
    background: #fff;
  }

  .chat-input-row textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    overflow-y: auto;
    border: 1.5px solid var(--line);
    border-radius: var(--r-pill);
    padding: 11px 16px;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
    transition: border-color var(--fast), box-shadow var(--fast);
  }
  .chat-input-row textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31,175,155,0.12);
  }

  .chat-input-row button {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--teal-700));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: filter var(--fast), transform var(--fast);
  }
  .chat-input-row button:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
  .chat-input-row button:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ==================== ریسپانسیو ==================== */
  @media (max-width: 1100px) { .topbar-support-phone span { display: none; } }

  @media (max-width: 900px) {
    .topbar-info { max-width: 40vw; }
    .ti-item:nth-child(n+7) { display: none; } /* روی صفحه‌ی متوسط، نرخ سکه/طلا جمع می‌شوند */
  }

  @media (max-width: 768px) {
    .topbar-wrap { padding: 8px 8px 0; }
    .topbar { padding: 7px 10px; gap: 4px; border-radius: 18px; }

    .topbar-user .who { display: none; }
    .topbar-user .chev { display: none; }
    .topbar-social { display: none; }
    .topbar-icon { width: 36px; height: 36px; }

    .topbar-info { max-width: 34vw; }
    .ti-item:nth-child(n+5) { display: none; } /* موبایل: فقط تاریخ + آب‌وهوا */

    .user-dropdown, .file-panel, .members-panel, .chat-panel {
      position: fixed !important;
      left: 10px !important;
      right: 10px !important;
      top: auto !important;
      bottom: 10px !important;
      width: auto !important;
      max-width: none !important;
      max-height: min(78vh, 640px) !important;
      border-radius: var(--r-lg) !important;
      animation: sheetUp 0.28s var(--ease);
    }

    .user-dropdown {
      max-height: none !important;
      width: 200px !important;
      left: auto !important;
      right: 10px !important;
      bottom: auto !important;
      top: 64px !important;
    }

    .file-panel::before, .members-panel::before, .chat-panel::before {
      content: '';
      position: absolute;
      top: 9px;
      right: 50%;
      transform: translateX(50%);
      width: 36px;
      height: 4px;
      border-radius: 3px;
      background: var(--line);
    }

    .file-panel-head, .members-panel-head, .chat-panel-head { padding-top: 20px; }
  }

  @keyframes sheetUp {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 400px) {
    .topbar-icon { width: 34px; height: 34px; }
    .topbar { padding: 6px 8px; gap: 2px; }
    .topbar-info { max-width: 28vw; }
  }
</style>

<!-- ==================== نشانگر وضعیت اتصال اینترنت ==================== -->
<script>
  (function () {
    var el = document.getElementById('connStatus');
    var dot = document.getElementById('connDot');
    var label = document.getElementById('connLabel');
    if (!el) return;

    function setOnline() {
      el.classList.remove('is-offline');
      el.title = 'اتصال برقرار است';
      if (label) label.textContent = 'آنلاین';
    }
    function setOffline() {
      el.classList.add('is-offline');
      el.title = 'اتصال اینترنت قطع شده است';
      if (label) label.textContent = 'آفلاین';
    }

    navigator.onLine ? setOnline() : setOffline();
    window.addEventListener('online', setOnline);
    window.addEventListener('offline', setOffline);
  })();
</script>

<!-- ==================== دکمه تعویض تم (شب/روز) ==================== -->
<script>
  (function () {
    var btn = document.getElementById('themeToggleBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('sahel-theme', next); } catch (e) {}
    });
  })();
</script>

<!-- ==================== حذف خودکار اسکلتون چیپ کاربر بعد از لود داده واقعی ==================== -->
<script>
  (function () {
    var chip = document.getElementById('topbarUser');
    var nameEl = document.getElementById('topbarName');
    if (!chip || !nameEl) return;
    var placeholder = nameEl.textContent;
    var done = false;
    function clear() {
      if (done) return;
      done = true;
      chip.classList.remove('is-loading');
      observer.disconnect();
    }
    var observer = new MutationObserver(function () {
      if (nameEl.textContent !== placeholder) clear();
    });
    observer.observe(nameEl, { childList: true, characterData: true, subtree: true });
    setTimeout(clear, 8000);
  })();
</script>

<!-- ==================== نوار شیشه‌ای: تشدید سایه هنگام اسکرول ==================== -->
<script>
  (function () {
    var topbar = document.querySelector('.topbar');
    var scrollHost = document.querySelector('.page') || window;
    if (!topbar) return;
    function onScroll() {
      var y = scrollHost === window ? window.scrollY : scrollHost.scrollTop;
      topbar.classList.toggle('is-scrolled', y > 4);
    }
    scrollHost.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>

<!-- ==================== PWA: ثبت سرویس‌ورکر ==================== -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('ثبت سرویس‌ورکر ناموفق بود:', err);
      });
    });
  }
</script>
