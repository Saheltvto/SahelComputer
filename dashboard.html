<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارتابل | حسابداری هوشمند ساحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  /* --- استایل‌های اضافه برای نمای تمام‌صفحه کارتابل، منوی کاربر و صندوق فایل --- */
  html, body { height: 100%; }
  .app-shell { display: block; }
  .main-col { display: flex; flex-direction: column; height: 100vh; }
  .page { flex: 1; padding: 0 !important; min-height: 0; }

  .topbar-user { position: relative; cursor: pointer; }

  /* هر دو پنل با position:fixed رندر می‌شن و مختصاتشون با جاوااسکریپت
     بر اساس محل دکمه محاسبه می‌شه، تا هیچ ancestor ای (با overflow:hidden
     یا ارتفاع ثابت) نصفشون رو نبره. */
  .user-dropdown, .file-panel, .members-panel, .chat-panel {
    position: fixed;
    background: #fff;
    border: 1px solid #E9F1F1;
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(11,61,66,0.14), 0 2px 8px rgba(11,61,66,0.06);
    z-index: 500;
    display: none;
    animation: panelPop .16s ease;
  }
  @keyframes panelPop {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .user-dropdown {
    min-width: 160px;
    padding: 8px;
  }
  .user-dropdown-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px;
    border-radius: 10px;
    color: #C0472B;
    text-decoration: none;
    font-weight: 600;
    font-size: 13.5px;
    transition: background .15s ease;
  }
  .user-dropdown-logout:hover { background: rgba(192,71,43,0.09); }

  #workspaceFrame { display: none; width: 100%; flex: 1; border: none; background: #fff; }
  #workspaceEmpty {
    display: none;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #7F9A9C;
    padding: 40px;
  }
  #workspaceView { display: flex; flex-direction: column; height: 100%; }

  /* --- صندوق ارسال/دریافت فایل --- */
  .topbar-icon { position: relative; cursor: pointer; }
  .file-panel {
    width: 336px;
    max-height: 460px;
    flex-direction: column;
    text-align: right;
    cursor: default;
    overflow: hidden;
  }
  .file-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(135deg, #0B3D42, #14555C);
  }
  .file-panel-head b { font-weight: 700; color: #fff; font-size: 14px; }
  .file-panel-head .btn-add {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    color: #0B3D42;
    background: #8FE3D3;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: filter .15s ease, transform .15s ease;
  }
  .file-panel-head .btn-add:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .file-panel-head .btn-add.is-open { background: rgba(255,255,255,0.18); color: #fff; }

  #fileSendForm {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #EDF3F3;
    background: #F6FAFA;
  }
  .field-label { font-size: 11.5px; color: #7F9A9C; font-weight: 600; margin-bottom: 2px; }
  #fileSendForm select {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1.5px solid #E0EAEA;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="%237F9A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat left 10px center;
    background-size: 16px;
    color: #0B3D42;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  #fileSendForm select:focus { outline: none; border-color: #2FB8A6; }

  .file-upload {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed #C9DEDE;
    border-radius: 10px;
    background: #fff;
    color: #7F9A9C;
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .file-upload:hover { border-color: #2FB8A6; color: #2FB8A6; background: rgba(47,184,166,0.04); }
  .file-upload svg { flex-shrink: 0; }
  .file-upload.has-file { border-style: solid; border-color: #2FB8A6; color: #0B3D42; background: rgba(47,184,166,0.06); }
  #fileInputLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #fileChipsList { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .file-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: #fff;
    border: 1px solid #E0EAEA;
    border-radius: 8px;
    font-size: 12.3px;
    color: #0B3D42;
  }
  .file-chip-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip-size { color: #7F9A9C; font-size: 11px; flex-shrink: 0; }
  .file-chip-remove {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(192,71,43,0.1);
    color: #C0472B;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease;
  }
  .file-chip-remove:hover { background: #C0472B; color: #fff; }

  #fileSendBtn {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #2FB8A6, #1B6B76);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: filter .15s ease, transform .15s ease, opacity .15s ease;
  }
  #fileSendBtn:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
  #fileSendBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #fileSendStatus { font-size: 12px; min-height: 16px; text-align: center; font-weight: 600; }

  #fileList { overflow-y: auto; flex: 1; max-height: 300px; }
  #fileList::-webkit-scrollbar { width: 6px; }
  #fileList::-webkit-scrollbar-thumb { background: #DCE9E9; border-radius: 6px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    border-bottom: 1px solid #F1F5F5;
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: background .15s ease;
  }
  .file-item:hover { background: #F6FAFA; }
  .file-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EAF6F4;
    color: #2FB8A6;
  }
  .file-item-body { flex: 1; min-width: 0; }
  .file-item-body b {
    display: block;
    font-size: 13px;
    color: #0B3D42;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item-body span { font-size: 11.5px; color: #7F9A9C; }
  .file-item.unread .file-item-body b { font-weight: 800; }
  .unread-dot {
    position: absolute;
    inset-inline-start: 14px;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2FB8A6;
  }
  .file-empty { padding: 30px 16px; text-align: center; color: #7F9A9C; font-size: 13px; }

  /* --- کشوی کارتابل اعضا (فقط مدیر) --- */
  .members-panel {
    width: 270px;
    max-height: 400px;
    flex-direction: column;
    overflow: hidden;
    text-align: right;
    cursor: default;
  }
  .members-panel-head {
    padding: 14px 16px;
    background: linear-gradient(135deg, #0B3D42, #14555C);
  }
  .members-panel-head b { color: #fff; font-size: 14px; font-weight: 700; }
  #membersList { overflow-y: auto; flex: 1; max-height: 340px; }
  #membersList::-webkit-scrollbar { width: 6px; }
  #membersList::-webkit-scrollbar-thumb { background: #DCE9E9; border-radius: 6px; }
  .member-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid #F1F5F5;
    transition: background .15s ease;
  }
  .member-row:hover { background: #F6FAFA; }
  .member-row.active { background: rgba(47,184,166,0.08); }
  .member-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #0B3D42;
    color: #8FE3D3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .member-info { flex: 1; min-width: 0; }
  .member-info b {
    display: block;
    font-size: 13px;
    color: #0B3D42;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .member-info span { font-size: 11px; color: #7F9A9C; }
  .member-check {
    display: none;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #2FB8A6;
    color: #fff;
    align-items: center;
    justify-content: center;
  }
  .member-row.active .member-check { display: flex; }

/* --- نوار اطلاعات زنده (تاریخ، آب‌وهوا، نرخ‌ها) --- */
/* --- استایل نوار اطلاعات زنده --- */
.topbar-info {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-inline-end: auto;
  padding: 8px 16px;
  background: linear-gradient(135deg, #F6FAFA, #EAF6F4);
  border: 1px solid #E0EAEA;
  border-radius: 25px;
  font-size: 12px;
  color: #0B3D42;
  white-space: nowrap;
  overflow-x: auto;
  max-width: 48vw;
  box-shadow: 0 2px 10px rgba(11,61,66,0.08);
}
.topbar-info::-webkit-scrollbar { display: none; }

.ti-item { 
  display: flex; 
  align-items: center; 
  gap: 5px; 
  font-weight: 600; 
  flex-shrink: 0;
  padding: 5px 10px;
  border-radius: 15px;
  transition: all 0.2s ease;
  cursor: default;
}
.ti-item:hover {
  background: rgba(47,184,166,0.1);
  transform: translateY(-1px);
}

.ti-sep { 
  width: 1px; 
  height: 18px; 
  background: #DCE9E9; 
  flex-shrink: 0; 
}

/* استایل برچسب‌ها */
.rate-label {
  font-size: 11px;
  font-weight: 700;
  color: #7F9A9C;
  margin-left: 2px;
}

.rate-value {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.date-value {
  font-size: 12.5px;
  font-weight: 700;
}

/* رنگ‌های جداگانه برای هر آیتم */
#tiDate {
  color: #0B3D42;
}

#tiWeather {
  color: #1B6B76;
}

#tiUsd {
  color: #2FB8A6;
}

#tiUsd .rate-value {
  color: #0B8F7A;
}

#tiAed {
  color: #C0472B;
}

#tiAed .rate-value {
  color: #A03A22;
}

#tiCoin {
  color: #B8860B;
}

#tiCoin .rate-value {
  color: #9A7209;
}

@media (max-width: 900px) { 
  .topbar-info { 
    display: none; 
  } 
}
  /* --- گوشه برند + شبکه‌های اجتماعی + شماره پشتیبانی --- */
  .topbar-brand-zone { display: flex; align-items: center; gap: 14px; }
  .brand-link { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--deep, #0B3D42); text-decoration: none; }
  .topbar-social { display: flex; align-items: center; gap: 8px; }
  .topbar-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #F6FAFA;
    color: #0B3D42;
    transition: background .15s ease, color .15s ease, transform .15s ease;
  }
  .topbar-social a:hover { background: #2FB8A6; color: #fff; transform: translateY(-1px); }
  .topbar-social a svg { width: 15px; height: 15px; }
  .topbar-support-phone { width: auto !important; border-radius: 20px !important; padding: 0 12px; gap: 6px; font-size: 12.5px; font-weight: 700; }
  .topbar-support-phone span { white-space: nowrap; }
  @media (max-width: 1100px) { .topbar-support-phone span { display: none; } }
  @media (max-width: 720px) { .topbar-social { display: none; } }

  /* --- چت‌باکس داخلی --- */
  .chat-panel {
    width: 340px;
    max-height: 480px;
    flex-direction: column;
    overflow: hidden;
    text-align: right;
    cursor: default;
  }
  .chat-panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #0B3D42, #14555C);
  }
  .chat-panel-head b { color: #fff; font-size: 14px; font-weight: 700; }
  .chat-back-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #chatContactsView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #chatContactsList { overflow-y: auto; flex: 1; max-height: 400px; }
  #chatContactsList::-webkit-scrollbar { width: 6px; }
  #chatContactsList::-webkit-scrollbar-thumb { background: #DCE9E9; border-radius: 6px; }
  .chat-contact-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid #F1F5F5;
    position: relative;
    transition: background .15s ease;
  }
  .chat-contact-row:hover { background: #F6FAFA; }
  .chat-contact-row .member-info b { display: flex; align-items: center; gap: 6px; }
  .chat-contact-last { font-size: 11.5px; color: #7F9A9C; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; max-width: 190px; }
  .chat-unread-dot { position: absolute; inset-inline-start: 14px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: #2FB8A6; }
  #chatMessages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: #F9FCFC; }
  #chatMessages::-webkit-scrollbar { width: 6px; }
  #chatMessages::-webkit-scrollbar-thumb { background: #DCE9E9; border-radius: 6px; }
  .chat-bubble { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.6; word-break: break-word; }
  .chat-bubble a { color: inherit; text-decoration: underline; }
  .chat-bubble-in { align-self: flex-start; background: #EAF6F4; color: #0B3D42; border-bottom-left-radius: 4px; }
  .chat-bubble-out { align-self: flex-end; background: linear-gradient(135deg, #2FB8A6, #1B6B76); color: #fff; border-bottom-right-radius: 4px; }
  .chat-bubble-out a { color: #fff; }
  .chat-bubble-time { display: block; font-size: 10px; opacity: 0.65; margin-top: 3px; }
  .chat-input-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #EDF3F3; background: #fff; }
  .chat-input-row input { flex: 1; border: 1.5px solid #E0EAEA; border-radius: 20px; padding: 9px 14px; font-family: inherit; font-size: 13px; color: #0B3D42; }
  .chat-input-row input:focus { outline: none; border-color: #2FB8A6; }
  .chat-input-row button { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; border: none; background: linear-gradient(135deg, #2FB8A6, #1B6B76); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .chat-input-row button:hover { filter: brightness(1.05); }
</style>
</head>

      <div class="topbar-brand-zone">
        <a href="index.html" class="brand-link">

  <div class="user-dropdown" id="userDropdown">

  <div class="file-panel" id="filePanel">
    <div class="file-panel-head">
      <b>ارسال و دریافت فایل</b>
      <button type="button" id="newFileBtn" class="btn-add">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        ارسال فایل
      </button>
    </div>

    <div id="fileSendForm">
      <div>
        <div class="field-label">گیرنده</div>
        <select id="fileRecipient">
          <option value="">در حال بارگذاری کاربران...</option>
        </select>
      </div>
      <div>
        <div class="field-label">فایل‌ها</div>
        <label class="file-upload" for="fileInput" id="fileUploadLabel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="fileInputLabel">انتخاب فایل (چند فایل هم‌زمان ممکن است)</span>
        </label>
        <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.png,.jpg,.jpeg" multiple style="display:none;">
        <div id="fileChipsList"></div>
      </div>
      <button type="button" id="fileSendBtn">ارسال فایل</button>
      <span id="fileSendStatus"></span>
    </div>

    <div id="fileList">
      <div class="file-empty">در حال بارگذاری...</div>
    </div>
  </div>

  <div class="members-panel" id="membersPanel">
    <div class="members-panel-head"><b>کارتابل اعضا</b></div>
    <div id="membersList">
      <div class="file-empty">در حال بارگذاری...</div>
    </div>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="chat-panel-head">
      <button type="button" id="chatBackBtn" class="chat-back-btn" style="display:none;" title="بازگشت به لیست">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M10 6L4 12L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <b id="chatPanelTitle">گفتگوها</b>
    </div>

    <div id="chatContactsView">
      <div id="chatContactsList">
        <div class="file-empty">در حال بارگذاری...</div>
      </div>
    </div>

    <div id="chatThreadView" style="display:none; flex-direction:column; flex:1; min-height:0;">
      <div id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="پیام یا لینک بنویسید...">
        <button type="button" id="chatSendBtn" title="ارسال">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 3L3 10.5L11 12.5M21 3L13.5 21L11 12.5M21 3L11 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
