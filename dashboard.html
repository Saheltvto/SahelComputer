<script>
  (function () {
    try {
      var saved = localStorage.getItem('sahel-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<style>
  /* ==================== استایل‌های پایه ==================== */
  :root {
    --deep: #0B3D42;
    --teal: #14555C;
    --accent: #2FB8A6;
    --accent-light: #8FE3D3;
    --bg-light: #F6FAFA;
    --bg-accent: #EAF6F4;
    --border: #E0EAEA;
    --border-light: #E9F1F1;
    --text: #0B3D42;
    --text-muted: #7F9A9C;
    --danger: #C0472B;
    --gold: #B8860B;
    --shadow-sm: 0 2px 10px rgba(11,61,66,0.08);
    --shadow-md: 0 4px 20px rgba(11,61,66,0.12);
    --shadow-lg: 0 16px 40px rgba(11,61,66,0.14);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 25px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    /* شیشه‌ای مدرن */
    --glass-bg: rgba(255, 255, 255, 0.62);
    --glass-bg-strong: rgba(255, 255, 255, 0.86);
    --glass-border: rgba(255, 255, 255, 0.55);
    --glass-highlight: rgba(255, 255, 255, 0.9);
    --glass-shadow: 0 8px 32px rgba(11,61,66,0.16), 0 1px 0 rgba(255,255,255,0.6) inset;
    --bubble-in-bg: var(--bg-accent);
    --chat-area-bg: #F9FCFC;
  }

  /* ==================== حالت تاریک ==================== */
  :root[data-theme="dark"] {
    --bg-light: #0C2226;
    --bg-accent: rgba(143, 227, 211, 0.10);
    --border: rgba(255, 255, 255, 0.12);
    --border-light: rgba(255, 255, 255, 0.09);
    --text: #EAF6F4;
    --text-muted: #86ADAF;
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.35);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.45);
    --glass-bg: rgba(16, 43, 47, 0.60);
    --glass-bg-strong: rgba(16, 43, 47, 0.88);
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-highlight: rgba(255, 255, 255, 0.10);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.05) inset;
  }

  :root[data-theme="dark"] .topbar-icon,
  :root[data-theme="dark"] .brand-link {
    color: var(--text);
  }

  :root[data-theme="dark"] #workspaceFrame {
    background: var(--bg-light);
  }

  :root[data-theme="dark"] #fileSendForm select,
  :root[data-theme="dark"] .file-chip,
  :root[data-theme="dark"] .chat-input-row,
  :root[data-theme="dark"] .chat-input-row textarea,
  :root[data-theme="dark"] .file-upload {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }

  :root[data-theme="dark"] #fileSendForm {
    background: rgba(255,255,255,0.03);
  }

  :root[data-theme="dark"] {
    --bubble-in-bg: rgba(255, 255, 255, 0.08);
    --chat-area-bg: #0C2226;
  }

  html { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  html, body { 
    height: 100%; 
    margin: 0;
    font-family: 'Vazirmatn', sans-serif;
  }
  
  .app-shell { display: block; }
  .main-col { display: flex; flex-direction: column; height: 100vh; }
  .page { flex: 1; padding: 0 !important; min-height: 0; }

  /* ==================== نوار بالایی (شیشه‌ای شناور) ==================== */
  body {
    background: var(--bg-light);
    color: var(--text);
    transition: background 0.35s ease, color 0.35s ease;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    margin: 12px 14px 10px;
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(1.6);
    -webkit-backdrop-filter: blur(22px) saturate(1.6);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: var(--glass-shadow);
    position: sticky;
    top: 12px;
    z-index: 100;
    transition: box-shadow 0.35s ease, background 0.35s ease;
  }

  .topbar::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(143,227,211,0.15) 40%, rgba(255,255,255,0) 70%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .topbar.is-scrolled {
    box-shadow: 0 12px 40px rgba(11,61,66,0.22), 0 1px 0 rgba(255,255,255,0.6) inset;
    background: var(--glass-bg-strong);
  }

  .topbar-user { 
    position: relative; 
    cursor: pointer; 
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 12px;
    transition: var(--transition);
  }
  
  .topbar-user:hover {
    background: rgba(47,184,166,0.1);
    box-shadow: 0 2px 10px rgba(47,184,166,0.12) inset;
  }
  
  .topbar-user .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--deep), var(--teal));
    color: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    border: 2px solid transparent;
    transition: var(--transition);
  }
  
  .topbar-user:hover .avatar {
    border-color: var(--accent);
    transform: scale(1.05);
    box-shadow: 0 0 0 4px rgba(47,184,166,0.15);
  }
  
  .topbar-user .who {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  
  .topbar-user .who b {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  
  .topbar-user .who span {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.3;
  }

  /* ==================== آیکون‌های نوار ==================== */
  .topbar-icon { 
    position: relative; 
    cursor: pointer; 
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    color: var(--deep);
    transition: var(--transition);
  }
  
  .topbar-icon svg {
    width: 22px;
    height: 22px;
  }
  
  .topbar-icon:hover {
    background: rgba(47,184,166,0.12);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(47,184,166,0.22);
  }
  
  .topbar-icon:active {
    transform: translateY(0) scale(0.96);
  }

  .topbar-icon.is-active {
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff;
    box-shadow: 0 6px 18px rgba(47,184,166,0.35);
  }
  
  .badge {
    position: absolute;
    top: 2px;
    left: 2px;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
    animation: badgePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes badgePop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  /* ==================== نوار اطلاعات زنده ==================== */
  .topbar-info {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-inline-end: auto;
    padding: 5px;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(16px) saturate(1.5);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow-x: auto;
    max-width: 48vw;
    position: relative;
    box-shadow: 0 2px 12px rgba(11,61,66,0.06), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: background 0.35s ease, border-color 0.35s ease;
  }

  :root[data-theme="dark"] .topbar-info {
    box-shadow: 0 2px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  
  .topbar-info::-webkit-scrollbar { display: none; }

  /* نشانگر «زنده» گوشه‌ی نوار اطلاعات */
  .topbar-info::after {
    content: '';
    position: absolute;
    top: -3px;
    inset-inline-start: -3px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--glass-bg-strong);
    animation: pulse 2s infinite;
    pointer-events: none;
  }

  .ti-item { 
    display: flex; 
    align-items: center; 
    gap: 7px; 
    font-weight: 600; 
    flex-shrink: 0;
    padding: 6px 11px;
    border-radius: 13px;
    transition: var(--transition);
    cursor: default;
    position: relative;
    animation: fadeInUp 0.5s ease;
    animation-fill-mode: both;
  }
  
  .ti-item:nth-child(1) { animation-delay: 0.05s; }
  .ti-item:nth-child(3) { animation-delay: 0.15s; }
  .ti-item:nth-child(5) { animation-delay: 0.25s; }
  .ti-item:nth-child(7) { animation-delay: 0.35s; }
  .ti-item:nth-child(9) { animation-delay: 0.45s; }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .ti-item:hover {
    background: rgba(47,184,166,0.14);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.18);
  }

  /* آیکون اختصاصی هر مورد (تقویم / ابر / سکه) به‌جای نقطه‌ی چشمک‌زن یکسان */
  .ti-item::before {
    content: '';
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    background-color: currentColor;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-position: center;
    mask-position: center;
    opacity: 0.85;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,184,166,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(47,184,166,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,184,166,0); }
  }
  
  .ti-sep { 
    width: 1px; 
    height: 20px; 
    background: linear-gradient(to bottom, transparent, var(--border), transparent);
    flex-shrink: 0; 
  }
  
  .rate-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    transition: color 0.2s ease;
  }
  
  .ti-item:hover .rate-label { color: var(--text); }
  
  .rate-value {
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: -0.3px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    transition: var(--transition);
  }
  
  .ti-item:hover .rate-value { transform: scale(1.05); }
  
  .date-value {
    font-size: 12.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  
  .weather-temp {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .weather-desc { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .weather-city {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    background: rgba(47,184,166,0.15);
    padding: 2px 7px;
    border-radius: 8px;
    transition: var(--transition);
  }
  
  .ti-item:hover .weather-city {
    background: rgba(47,184,166,0.25);
    color: var(--text);
  }
  
  #tiDate    { color: var(--text); font-weight: 700; }
  #tiWeather { color: var(--accent); }
  #tiUsd .rate-value  { color: #0B8F7A; }
  #tiAed .rate-value  { color: #C1662E; }
  #tiCoin .rate-value { color: #A9820A; }
  #tiUsd::before, #tiUsd    { color: #0B8F7A; }
  #tiAed::before, #tiAed    { color: #C1662E; }
  #tiCoin::before, #tiCoin  { color: #A9820A; }

  #tiGold::before, #tiGold, #tiGold .rate-value { color: var(--gold); }

  :root[data-theme="dark"] #tiWeather { color: var(--accent-light); }
  :root[data-theme="dark"] #tiUsd .rate-value, :root[data-theme="dark"] #tiUsd::before, :root[data-theme="dark"] #tiUsd { color: #4FE0C4; }
  :root[data-theme="dark"] #tiAed .rate-value, :root[data-theme="dark"] #tiAed::before, :root[data-theme="dark"] #tiAed { color: #FF9A7A; }
  :root[data-theme="dark"] #tiCoin .rate-value, :root[data-theme="dark"] #tiCoin::before, :root[data-theme="dark"] #tiCoin { color: #F2C94C; }
  :root[data-theme="dark"] #tiGold .rate-value, :root[data-theme="dark"] #tiGold::before, :root[data-theme="dark"] #tiGold { color: #F6D776; }

  /* ===== فلش روند صعودی/نزولی نرخ =====
     کلاس trend-up / trend-down به‌صورت خودکار (با مقایسه مقدار قبلی و جدید) به .ti-item اضافه می‌شود. */
  .ti-item .trend-arrow {
    display: inline-block;
    font-size: 10px;
    line-height: 1;
    margin-inline-start: 1px;
    transition: var(--transition);
  }
  .ti-item.trend-up .rate-value { color: #16A34A !important; }
  .ti-item.trend-up .trend-arrow { color: #16A34A; }
  .ti-item.trend-up .trend-arrow::before { content: '▲'; }
  .ti-item.trend-down .rate-value { color: #DC2626 !important; }
  .ti-item.trend-down .trend-arrow { color: #DC2626; }
  .ti-item.trend-down .trend-arrow::before { content: '▼'; }

  /* ===== نشانگر وضعیت اتصال اینترنت ===== */
  .conn-status {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: var(--transition);
  }
  .conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  .conn-status.is-offline {
    color: var(--danger);
    background: rgba(192,71,43,0.1);
    border-color: rgba(192,71,43,0.25);
  }
  .conn-status.is-offline .conn-dot {
    background: var(--danger);
    animation: none;
  }
  @media (max-width: 560px) {
    .conn-status .conn-label { display: none; }
    .conn-status { padding: 7px; }
  }
  
  #tiUsd:hover .rate-value,
  #tiCoin:hover .rate-value {
    animation: glow 1.5s ease-in-out;
  }
  
  @keyframes glow {
    0% { text-shadow: 0 0 0 rgba(47,184,166,0); }
    50% { text-shadow: 0 0 8px rgba(47,184,166,0.4); }
    100% { text-shadow: 0 0 0 rgba(47,184,166,0); }
  }

  /* ==================== گوشه برند ==================== */
  .topbar-brand-zone { display: flex; align-items: center; gap: 12px; }
  
  .brand-link { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    font-weight: 800; 
    color: var(--deep); 
    text-decoration: none;
    transition: var(--transition);
  }
  
  .brand-link:hover { transform: scale(1.05); }
  
  .topbar-social { display: flex; align-items: center; gap: 6px; }
  
  .topbar-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-light);
    color: var(--deep);
    transition: var(--transition);
  }
  
  .topbar-social a:hover { 
    background: var(--accent); 
    color: #fff; 
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.3);
  }
  
  .topbar-social a svg { width: 15px; height: 15px; }
  
  .topbar-support-phone { 
    width: auto !important; 
    border-radius: 20px !important; 
    padding: 0 14px !important; 
    gap: 6px; 
    font-size: 12.5px; 
    font-weight: 700; 
    background: linear-gradient(135deg, var(--accent), var(--teal)) !important;
    color: #fff !important;
  }
  
  .topbar-support-phone:hover {
    background: linear-gradient(135deg, #3CC9B7, #1B6B76) !important;
  }
  
  .topbar-support-phone span { white-space: nowrap; }

  /* ==================== دکمه تعویض تم ==================== */
  #themeToggleBtn .icon-moon { display: none; }
  :root[data-theme="dark"] #themeToggleBtn .icon-sun { display: none; }
  :root[data-theme="dark"] #themeToggleBtn .icon-moon { display: block; }

  /* ==================== اسکلتون لودینگ (Shimmer) ==================== */
  .skeleton-row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
  }

  .skeleton-avatar,
  .skeleton-line {
    border-radius: 8px;
    background: linear-gradient(90deg,
      rgba(11,61,66,0.07) 25%,
      rgba(11,61,66,0.15) 37%,
      rgba(11,61,66,0.07) 63%);
    background-size: 400% 100%;
    animation: skeletonShimmer 1.5s ease infinite;
  }

  :root[data-theme="dark"] .skeleton-avatar,
  :root[data-theme="dark"] .skeleton-line {
    background: linear-gradient(90deg,
      rgba(255,255,255,0.06) 25%,
      rgba(255,255,255,0.16) 37%,
      rgba(255,255,255,0.06) 63%);
    background-size: 400% 100%;
  }

  .skeleton-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .skeleton-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .skeleton-line { height: 10px; }
  .skeleton-line.long { width: 78%; }
  .skeleton-line.mid { width: 55%; }
  .skeleton-line.short { width: 34%; }

  @keyframes skeletonShimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .skeleton-avatar, .skeleton-line { animation: none; }
  }

  /* اسکلتون چیپ کاربر بالای نوار، تا زمانی که نام واقعی لود شود */
  .topbar-user.is-loading .avatar {
    background: linear-gradient(90deg, rgba(11,61,66,0.10) 25%, rgba(11,61,66,0.2) 37%, rgba(11,61,66,0.10) 63%);
    background-size: 400% 100%;
    animation: skeletonShimmer 1.5s ease infinite;
    color: transparent;
  }

  .topbar-user.is-loading #topbarName,
  .topbar-user.is-loading #topbarRole {
    display: inline-block;
    color: transparent;
    border-radius: 5px;
    background: linear-gradient(90deg, rgba(11,61,66,0.08) 25%, rgba(11,61,66,0.17) 37%, rgba(11,61,66,0.08) 63%);
    background-size: 400% 100%;
    animation: skeletonShimmer 1.5s ease infinite;
  }

  .topbar-user.is-loading #topbarName { width: 78px; height: 12px; }
  .topbar-user.is-loading #topbarRole { width: 48px; height: 9px; margin-top: 2px; }

  :root[data-theme="dark"] .topbar-user.is-loading .avatar,
  :root[data-theme="dark"] .topbar-user.is-loading #topbarName,
  :root[data-theme="dark"] .topbar-user.is-loading #topbarRole {
    background: linear-gradient(90deg, rgba(255,255,255,0.07) 25%, rgba(255,255,255,0.18) 37%, rgba(255,255,255,0.07) 63%);
    background-size: 400% 100%;
  }

  /* ==================== پنل‌های کشویی ==================== */
  .user-dropdown, .file-panel, .members-panel, .chat-panel {
    position: fixed;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(28px) saturate(1.7);
    -webkit-backdrop-filter: blur(28px) saturate(1.7);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: var(--glass-shadow), 0 20px 50px rgba(11,61,66,0.18);
    z-index: 500;
    display: none;
    animation: panelPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes panelPop {
    from { opacity: 0; transform: translateY(-15px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .user-dropdown {
    min-width: 160px;
    padding: 8px;
  }
  
  .user-dropdown-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    color: var(--danger);
    text-decoration: none;
    font-weight: 600;
    font-size: 13.5px;
    transition: background 0.15s ease;
  }
  
  .user-dropdown-logout:hover { background: rgba(192,71,43,0.09); }

  /* ==================== ورک‌اسپیس ==================== */
  #workspaceFrame { display: none; width: 100%; flex: 1; border: none; background: #fff; }
  
  #workspaceEmpty {
    display: none;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
    font-size: 15px;
  }
  
  #workspaceView { display: flex; flex-direction: column; height: 100%; }

  /* ==================== صندوق فایل ==================== */
  .file-panel {
    width: 350px;
    max-height: 480px;
    flex-direction: column;
    text-align: right;
    cursor: default;
    overflow: hidden;
  }
  
  .file-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--deep), var(--teal));
  }
  
  .file-panel-head b { font-weight: 700; color: #fff; font-size: 14px; }
  
  .file-panel-head .btn-add {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--deep);
    background: var(--accent-light);
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .file-panel-head .btn-add:hover { 
    filter: brightness(1.06); 
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(143,227,211,0.4);
  }
  
  .file-panel-head .btn-add.is-open { background: rgba(255,255,255,0.18); color: #fff; }

  #fileSendForm {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #EDF3F3;
    background: var(--bg-light);
  }
  
  .field-label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
  
  #fileSendForm select {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="%237F9A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat left 10px center;
    background-size: 16px;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  
  #fileSendForm select:focus { outline: none; border-color: var(--accent); }

  .file-upload {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed #C9DEDE;
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--text-muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .file-upload:hover { 
    border-color: var(--accent); 
    color: var(--accent); 
    background: rgba(47,184,166,0.04); 
  }
  
  .file-upload svg { flex-shrink: 0; }
  
  .file-upload.has-file { 
    border-style: solid; 
    border-color: var(--accent); 
    color: var(--text); 
    background: rgba(47,184,166,0.06); 
  }
  
  #fileInputLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #fileChipsList { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  
  .file-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12.3px;
    color: var(--text);
  }
  
  .file-chip-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip-size { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
  
  .file-chip-remove {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(192,71,43,0.1);
    color: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }
  
  .file-chip-remove:hover { background: var(--danger); color: #fff; }

  #fileSendBtn {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
  }
  
  #fileSendBtn:hover:not(:disabled) { 
    filter: brightness(1.05); 
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(47,184,166,0.3);
  }
  
  #fileSendBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #fileSendStatus { font-size: 12px; min-height: 16px; text-align: center; font-weight: 600; }

  #fileList { overflow-y: auto; flex: 1; max-height: 320px; }
  #fileList::-webkit-scrollbar { width: 6px; }
  #fileList::-webkit-scrollbar-track { background: transparent; }
  #fileList::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    border-bottom: 1px solid #F1F5F5;
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: var(--transition);
  }
  
  .file-item:hover { background: var(--bg-light); }
  
  .file-item::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 50%;
    left: 50%;
    height: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  
  .file-item:hover::after { right: 0; left: 0; }
  
  .file-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-accent);
    color: var(--accent);
  }
  
  .file-item-body { flex: 1; min-width: 0; }
  
  .file-item-body b {
    display: block;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .file-item-body span { font-size: 11.5px; color: var(--text-muted); }
  .file-item.unread .file-item-body b { font-weight: 800; }
  
  .unread-dot {
    position: absolute;
    inset-inline-start: 14px;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  
  .file-empty { padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ==================== کشوی کارتابل اعضا ==================== */
  .members-panel {
    width: 280px;
    max-height: 420px;
    flex-direction: column;
    overflow: hidden;
    text-align: right;
    cursor: default;
  }
  
  .members-panel-head {
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--deep), var(--teal));
  }
  
  .members-panel-head b { color: #fff; font-size: 14px; font-weight: 700; }
  
  #membersList { overflow-y: auto; flex: 1; max-height: 360px; }
  #membersList::-webkit-scrollbar { width: 6px; }
  #membersList::-webkit-scrollbar-track { background: transparent; }
  #membersList::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }
  
  .member-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid #F1F5F5;
    position: relative;
    transition: var(--transition);
  }
  
  .member-row:hover { background: var(--bg-light); }
  .member-row.active { background: rgba(47,184,166,0.08); }
  
  .member-row::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 50%;
    left: 50%;
    height: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  
  .member-row:hover::after,
  .member-row.active::after { right: 0; left: 0; }
  
  .member-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--deep), var(--teal));
    color: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    flex-shrink: 0;
  }
  
  .member-info { flex: 1; min-width: 0; }
  
  .member-info b {
    display: block;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .member-info span { font-size: 11px; color: var(--text-muted); }
  
  .member-check {
    display: none;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    align-items: center;
    justify-content: center;
  }
  
  .member-row.active .member-check { display: flex; }

  /* ==================== چت‌باکس (بزرگ‌تر و شیک‌تر) ==================== */
  .chat-panel {
    width: 440px;
    max-height: 620px;
    flex-direction: column;
    overflow: hidden;
    text-align: right;
    cursor: default;
  }
  
  .chat-panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 18px;
    background: linear-gradient(135deg, var(--deep), var(--teal));
  }
  
  .chat-panel-head b { color: #fff; font-size: 15px; font-weight: 700; }
  
  .chat-back-btn { 
    background: rgba(255,255,255,0.15); 
    border: none; 
    color: #fff; 
    width: 26px; 
    height: 26px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer;
    transition: var(--transition);
  }
  
  .chat-back-btn:hover { background: rgba(255,255,255,0.25); }
  
  #chatContactsView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  
  #chatContactsList { overflow-y: auto; flex: 1; max-height: 540px; }
  #chatContactsList::-webkit-scrollbar { width: 6px; }
  #chatContactsList::-webkit-scrollbar-track { background: transparent; }
  #chatContactsList::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }
  
  .chat-contact-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    cursor: pointer;
    border-bottom: 1px solid #F1F5F5;
    position: relative;
    transition: var(--transition);
  }
  
  .chat-contact-row:hover { background: var(--bg-light); }
  
  .chat-contact-row::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 50%;
    left: 50%;
    height: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  
  .chat-contact-row:hover::after { right: 0; left: 0; }
  
  .chat-contact-row .member-info b { display: flex; align-items: center; gap: 6px; }
  
  .chat-contact-last { 
    font-size: 11.5px; 
    color: var(--text-muted); 
    overflow: hidden; 
    text-overflow: ellipsis; 
    white-space: nowrap; 
    display: block; 
    max-width: 260px; 
  }
  
  .chat-unread-dot { 
    position: absolute; 
    inset-inline-start: 16px; 
    top: 15px; 
    width: 9px; 
    height: 9px; 
    border-radius: 50%; 
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  
  #chatMessages { 
    flex: 1; 
    overflow-y: auto; 
    padding: 18px; 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    background: var(--chat-area-bg);
    transition: background 0.35s ease;
  }
  
  #chatMessages::-webkit-scrollbar { width: 6px; }
  #chatMessages::-webkit-scrollbar-track { background: transparent; }
  #chatMessages::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent), var(--teal)); border-radius: 6px; }
  
  .chat-bubble { 
    max-width: 82%; 
    padding: 10px 14px; 
    border-radius: 16px; 
    font-size: 13.5px; 
    line-height: 1.7; 
    word-break: break-word;
    box-shadow: 0 1px 3px rgba(11,61,66,0.06);
    transition: var(--transition);
  }
  
  .chat-bubble:hover { transform: translateY(-1px); }
  .chat-bubble a { color: inherit; text-decoration: underline; }
  
  .chat-bubble-in { 
    align-self: flex-start; 
    background: var(--bubble-in-bg); 
    color: var(--text); 
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    animation: bubbleIn 0.3s ease;
  }
  
  .chat-bubble-out { 
    align-self: flex-end; 
    background: linear-gradient(135deg, var(--accent), var(--teal)); 
    color: #fff; 
    border-bottom-right-radius: 4px;
    animation: bubbleOut 0.3s ease;
  }
  
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  @keyframes bubbleOut {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  .chat-bubble-out a { color: #fff; }
  .chat-bubble-time { display: block; font-size: 10px; opacity: 0.65; margin-top: 3px; }
  
  .chat-input-row { 
    display: flex; 
    align-items: flex-end; 
    gap: 10px; 
    padding: 14px 16px; 
    border-top: 1px solid #EDF3F3; 
    background: #fff; 
  }
  
  .chat-input-row textarea { 
    flex: 1;
    resize: none;
    min-height: 46px;
    max-height: 120px;
    overflow-y: auto;
    border: 1.5px solid var(--border); 
    border-radius: 20px; 
    padding: 12px 16px; 
    font-family: inherit; 
    font-size: 13.5px; 
    line-height: 1.5;
    color: var(--text);
    transition: var(--transition);
  }
  
  .chat-input-row textarea:focus { 
    outline: none; 
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47,184,166,0.1);
  }
  
  .chat-input-row button { 
    flex-shrink: 0; 
    width: 46px; 
    height: 46px; 
    border-radius: 50%; 
    border: none; 
    background: linear-gradient(135deg, var(--accent), var(--teal)); 
    color: #fff; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(47,184,166,0.35);
    transition: var(--transition);
  }
  
  .chat-input-row button:hover:not(:disabled) { 
    filter: brightness(1.05);
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 6px 18px rgba(47,184,166,0.45);
  }

  .chat-input-row button:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ==================== ریسپانسیو ==================== */
  @media (max-width: 1100px) { 
    .topbar-support-phone span { display: none; } 
  }
  
  @media (max-width: 900px) { 
    .topbar-info { display: none; } 
  }
  
  @media (max-width: 768px) {
    .topbar {
      padding: 7px 10px;
      gap: 4px;
      margin: 8px 8px 8px;
      border-radius: 18px;
      top: 8px;
    }
    
    .topbar-user .who { display: none; }
    
    .topbar-user {
      padding: 4px;
    }
    
    .topbar-social { display: none; }
    
    .topbar-icon {
      width: 36px;
      height: 36px;
    }

    /* ===== کشوی پایین صفحه (Bottom Sheet) =====
       بدون توجه به مختصاتی که جاوااسکریپت برای top/left پنل تنظیم می‌کند،
       این قوانین با !important همیشه پنل را داخل صفحه و وسط‌چین نگه می‌دارند. */
    .user-dropdown,
    .file-panel,
    .members-panel,
    .chat-panel {
      position: fixed !important;
      left: 10px !important;
      right: 10px !important;
      top: auto !important;
      bottom: 10px !important;
      width: auto !important;
      max-width: none !important;
      max-height: min(78vh, 640px) !important;
      border-radius: 22px !important;
      animation: sheetUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .user-dropdown {
      max-height: none !important;
      width: 210px !important;
      left: auto !important;
      right: 10px !important;
      bottom: auto !important;
      top: 68px !important;
    }

    /* دستگیره‌ی کوچک بالای کشو، برای حس بومی موبایل */
    .file-panel::before,
    .members-panel::before,
    .chat-panel::before {
      content: '';
      position: absolute;
      top: 9px;
      right: 50%;
      transform: translateX(50%);
      width: 38px;
      height: 4px;
      border-radius: 3px;
      background: rgba(11,61,66,0.18);
    }

    .file-panel-head,
    .members-panel-head,
    .chat-panel-head {
      padding-top: 20px;
      border-radius: 22px 22px 0 0;
    }
  }

  @keyframes sheetUp {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  @media (max-width: 720px) { 
    .topbar-social { display: none; } 
  }

  @media (max-width: 400px) {
    .topbar-icon { width: 34px; height: 34px; }
    .topbar { padding: 6px 8px; gap: 2px; }
  }
</style>
</head>

<!-- ==================== نشانگر وضعیت اتصال اینترنت ==================== -->
<script>
  (function () {
    var el = document.getElementById('connStatus');
    var dot = document.getElementById('connDot');
    var label = document.getElementById('connLabel');
    if (!el) return;

    function setOnline() {
      el.classList.remove('is-offline');
      el.title = 'اتصال برقرار است';
      if (label) label.textContent = 'آنلاین';
    }
    function setOffline() {
      el.classList.add('is-offline');
      el.title = 'اتصال اینترنت قطع شده است';
      if (label) label.textContent = 'آفلاین';
    }

    navigator.onLine ? setOnline() : setOffline();
    window.addEventListener('online', setOnline);
    window.addEventListener('offline', setOffline);
  })();
</script>

<!-- ==================== فلش خودکار روند صعودی/نزولی نرخ‌ها ====================
     با مشاهده‌ی تغییر متن هر مقدار (rate-value)، عدد جدید با مقدار قبلی (ذخیره‌شده
     در localStorage) مقایسه می‌شود و کلاس trend-up / trend-down + فلش به‌صورت
     خودکار اضافه می‌شود؛ به هیچ تغییری در topbar-widgets.js نیاز ندارد. -->
<!-- ==================== Sparkline کوچک کنار هر نرخ (بدون بک‌اند، بدون کتابخانه) ====================
     این اسکریپت را دقیقاً بعد از اسکریپت «فلش خودکار روند صعودی/نزولی» که از قبل داری اضافه کن،
     یا کاملاً جایگزینش کن (چون این نسخه هم فلش را دارد هم spark-line را اضافه می‌کند). -->
<script>
  (function () {
    var ids = ['tiUsd', 'tiAed', 'tiCoin', 'tiGold'];
    var STORAGE_PREFIX = 'sahel-rate-history-';
    var HISTORY_LEN = 12; // تعداد نقاطی که در spark-line نشان داده می‌شود

    function toEnglishDigits(str) {
      var persian = '۰۱۲۳۴۵۶۷۸۹';
      var arabic = '٠١٢٣٤٥٦٧٨٩';
      return String(str).replace(/[۰-۹٠-٩]/g, function (ch) {
        var i = persian.indexOf(ch);
        if (i > -1) return i;
        i = arabic.indexOf(ch);
        return i > -1 ? i : ch;
      });
    }

    function extractNumber(text) {
      var normalized = toEnglishDigits(text).replace(/[^\d.]/g, '');
      if (!normalized) return null;
      var n = parseFloat(normalized);
      return isNaN(n) ? null : n;
    }

    function loadHistory(key) {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveHistory(key, arr) {
      try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {}
    }

    function buildSparkSvg(values, color) {
      var w = 44, h = 18, pad = 2;
      if (values.length < 2) return '';
      var min = Math.min.apply(null, values);
      var max = Math.max.apply(null, values);
      var range = (max - min) || 1;
      var step = (w - pad * 2) / (values.length - 1);

      var points = values.map(function (v, i) {
        var x = pad + i * step;
        var y = h - pad - ((v - min) / range) * (h - pad * 2);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');

      var lastUp = values[values.length - 1] >= values[0];
      var strokeColor = color || (lastUp ? '#16A34A' : '#DC2626');

      return '<svg class="rate-spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" ' +
        'preserveAspectRatio="none" style="vertical-align:middle;margin-inline-start:4px;">' +
        '<polyline points="' + points + '" fill="none" stroke="' + strokeColor + '" stroke-width="1.6" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    function ensureSparkSlot(item) {
      var valueEl = item.querySelector('.rate-value');
      if (!valueEl) return null;
      var slot = valueEl.querySelector('.rate-spark-slot');
      if (!slot) {
        slot = document.createElement('span');
        slot.className = 'rate-spark-slot';
        valueEl.appendChild(slot);
      }
      return slot;
    }

    function watch(id) {
      var item = document.getElementById(id);
      if (!item) return;
      var historyKey = STORAGE_PREFIX + id;

      function check() {
        var valueEl = item.querySelector('.rate-value');
        if (!valueEl) return;

        // متن خام را بدون spark-slot قبلی بخوان تا خودش را دوباره پارس نکند
        var slot = valueEl.querySelector('.rate-spark-slot');
        var rawText = slot ? valueEl.textContent.replace(slot.textContent, '') : valueEl.textContent;
        var current = extractNumber(rawText);
        if (current === null) return;

        var history = loadHistory(historyKey);
        var last = history.length ? history[history.length - 1] : null;

        item.classList.remove('trend-up', 'trend-down');
        if (last !== null && current !== last) {
          item.classList.add(current > last ? 'trend-up' : 'trend-down');
        }

        if (last !== current) {
          history.push(current);
          if (history.length > HISTORY_LEN) history = history.slice(-HISTORY_LEN);
          saveHistory(historyKey, history);
        }

        var target = ensureSparkSlot(item);
        if (target && history.length >= 2) {
          target.innerHTML = buildSparkSvg(history);
        }
      }

      var observer = new MutationObserver(function (mutations) {
        // از حلقه بی‌نهایت جلوگیری کن: فقط وقتی تغییر از طرف ما نبوده پردازش کن
        check();
      });
      observer.observe(item, { childList: true, subtree: true, characterData: true });
      check();
    }

    ids.forEach(watch);
  })();
</script>

<!-- ==================== دکمه تعویض تم (شب/روز) ==================== -->
<script>
  (function () {
    var btn = document.getElementById('themeToggleBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('sahel-theme', next); } catch (e) {}
    });
  })();
</script>

<!-- ==================== حذف خودکار اسکلتون چیپ کاربر بعد از لود داده واقعی ==================== -->
<script>
  (function () {
    var chip = document.getElementById('topbarUser');
    var nameEl = document.getElementById('topbarName');
    if (!chip || !nameEl) return;
    var placeholder = nameEl.textContent;
    var done = false;
    function clear() {
      if (done) return;
      done = true;
      chip.classList.remove('is-loading');
      observer.disconnect();
    }
    var observer = new MutationObserver(function () {
      if (nameEl.textContent !== placeholder) clear();
    });
    observer.observe(nameEl, { childList: true, characterData: true, subtree: true });
    setTimeout(clear, 8000); // اطمینان: حتی اگر تشخیص تغییر متن ناموفق بود، اسکلتون همیشگی نماند
  })();
</script>

<!-- ==================== نوار شیشه‌ای: تشدید سایه هنگام اسکرول ==================== -->
<script>
  (function () {
    var topbar = document.querySelector('.topbar');
    var scrollHost = document.querySelector('.page') || window;
    if (!topbar) return;
    function onScroll() {
      var y = scrollHost === window ? window.scrollY : scrollHost.scrollTop;
      topbar.classList.toggle('is-scrolled', y > 4);
    }
    scrollHost.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>

<!-- ==================== PWA: ثبت سرویس‌ورکر ==================== -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('ثبت سرویس‌ورکر ناموفق بود:', err);
      });
    });
  }
</script>
